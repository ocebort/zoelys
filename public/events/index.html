<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoélys — Member Events & Gatherings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">

  <style>
    main.container { max-width: 1100px; width: 100%; margin: 3rem auto 6rem auto; padding: 0 1.5rem; }
    .hero-sec { text-align: center; margin-bottom: 3rem; }
    .hero-sec h1 { font-family: var(--font-serif); font-size: 3.2rem; font-weight: 400; margin-bottom: 0.5rem; }
    
    .filter-pills { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin-bottom: 3rem; }
    .filter-pill { background: #FAF8F5; color: #1C1613; border: 1px solid #EFEAE3; padding: 0.6rem 1.4rem; border-radius: 2rem; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .filter-pill.active { background: #1C1613; color: white; border-color: #1C1613; }

    .events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; }
    .event-card { background: white; border: 1px solid #EFEAE3; border-radius: 1rem; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.02); display: flex; flex-direction: column; }
    .event-card img { width: 100%; height: 220px; object-fit: cover; }
    .event-body { padding: 1.8rem; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
  </style>
</head>
<body>

  <main class="container">
    <div class="hero-sec">
      <div style="font-size: 0.75rem; letter-spacing: 0.15em; color: var(--accent-coral); font-weight: 600; text-transform: uppercase;">MEMBER COMMUNITY</div>
      <h1>Exclusive Gatherings & Events</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Private rooftop socials, canine wellness workshops, and VIP dining in Miami.</p>
    </div>

    <!-- FILTER PILLS -->
    <div class="filter-pills">
      <button class="filter-pill active" onclick="filterEvents('All', this)">All Events</button>
      <button class="filter-pill" onclick="filterEvents('Social Mixer', this)">Social Mixers</button>
      <button class="filter-pill" onclick="filterEvents('Wellness & Yoga', this)">Wellness & Yoga</button>
      <button class="filter-pill" onclick="filterEvents('VIP Dinner', this)">VIP Dinners</button>
      <button class="filter-pill" onclick="filterEvents('Educational Workshop', this)">Workshops</button>
    </div>

    <!-- DYNAMIC EVENTS GRID -->
    <div class="events-grid" id="eventsContainer">
      <div style="text-align: center; grid-column: 1/-1; padding: 3rem; color: var(--text-muted);">Loading member events...</div>
    </div>
  </main>

  <script src="/navbar.js"></script>
  <script>
    let allEvents = [];

    async function fetchEvents() {
      try {
        const res = await fetch('/api/events');
        const data = await res.json();
        allEvents = data.events || data;
        renderEvents(allEvents);
      } catch (e) {
        document.getElementById('eventsContainer').innerHTML = '<div style="text-align: center; grid-column: 1/-1; color: var(--text-muted);">Unable to load events.</div>';
      }
    }

    function renderEvents(list) {
      const container = document.getElementById('eventsContainer');
      if (!list || list.length === 0) {
        container.innerHTML = '<div style="text-align: center; grid-column: 1/-1; padding: 4rem; color: var(--text-muted);">No upcoming events found in this category.</div>';
        return;
      }

      container.innerHTML = list.map(evt => `
        <div class="event-card">
          ${evt.image_url ? `<img src="${evt.image_url}" alt="${evt.title}">` : '<div style="height: 180px; background: #FAF6F0; display: flex; align-items: center; justify-content: center; font-size: 2rem;">🐾</div>'}
          <div class="event-body">
            <div>
              <div style="font-size: 0.7rem; letter-spacing: 0.12em; color: var(--accent-coral); font-weight: 600; text-transform: uppercase;">${evt.category || 'SOCIAL MIXER'} • ${evt.sponsor || 'ZOÉLYS'}</div>
              <h3 style="font-family: var(--font-serif); font-size: 1.8rem; margin: 0.4rem 0;">${evt.title}</h3>
              <div style="font-size: 0.8rem; color: var(--text-dark); font-weight: 600; margin-bottom: 0.8rem;">📅 ${evt.date || evt.event_date}</div>
              <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem;">📍 ${evt.location}</div>
              <p style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 1.5rem;">${evt.description || ''}</p>
            </div>
            <button style="background: var(--accent-coral); color: white; border: none; padding: 0.7rem 1.4rem; border-radius: 2rem; font-size: 0.75rem; font-weight: 600; cursor: pointer; width: 100%;" onclick="window.location.href='/join'">RSVP VIA PORTAL &rarr;</button>
          </div>
        </div>
      `).join('');
    }

    function filterEvents(category, btn) {
      document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (category === 'All') renderEvents(allEvents);
      else renderEvents(allEvents.filter(e => (e.category || '').toLowerCase() === category.toLowerCase()));
    }

    document.addEventListener('DOMContentLoaded', fetchEvents);
  </script>
</body>
</html>
