<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoélys Concierge — Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-dark: #1C1613;
      --bg-card: #251F1B;
      --border-color: #38312C;
      --accent-coral: #D97757;
      --text-main: #F7F3EC;
      --text-muted: #A39D95;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Inter', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      padding: 2rem 3rem;
      line-height: 1.5;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 2.5rem;
    }

    .logo {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .badge {
      background-color: var(--accent-coral);
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 1rem;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 2rem;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      padding: 1.5rem;
    }

    h2 {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      margin-bottom: 1.25rem;
      color: var(--text-main);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    th {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    td {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
    }

    tr:hover {
      background-color: rgba(255, 255, 255, 0.02);
      cursor: pointer;
    }

    .btn-match {
      background-color: var(--accent-coral);
      color: white;
      border: none;
      padding: 0.4rem 0.85rem;
      border-radius: 1.5rem;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .sitter-match-card {
      background-color: rgba(255,255,255,0.03);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .sitter-match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .match-score {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-coral);
    }

    .tag {
      display: inline-block;
      background: rgba(217, 119, 87, 0.15);
      color: var(--accent-coral);
      font-size: 0.65rem;
      padding: 0.2rem 0.5rem;
      border-radius: 0.25rem;
      margin-right: 0.3rem;
      margin-top: 0.3rem;
    }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; align-items: center; gap: 1rem;">
      <span class="logo">ZOÉLYS</span>
      <span class="badge">Concierge Admin</span>
    </div>
    <div style="font-size: 0.8rem; color: var(--text-muted);" id="requestCount">Loading requests...</div>
  </header>

  <div class="container">
    <div class="card">
      <h2>Incoming Client Requests</h2>
      <table>
        <thead>
          <tr>
            <th>Client Name</th>
            <th>Pet Info</th>
            <th>Neighbourhood</th>
            <th>Submitted</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="requestsTableBody">
          <tr><td colspan="5" style="color: var(--text-muted);">Fetching requests from Supabase...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card">
      <h2>Matchmaking Results</h2>
      <div id="matchmakerNotice" style="font-size: 0.85rem; color: var(--text-muted);">
        Select a client request on the left and click <strong>"RUN MATCH"</strong> to evaluate available sitters.
      </div>
      <div id="matchesContainer" style="margin-top: 1rem;"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://jowdczqmpunzqzjyfzsu.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_2comxcjifEM0qY7YbH9sTA_nBzh-APR';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadRequests() {
      const { data: requests, error } = await supabaseClient
        .from('client_requests')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error fetching requests:', error);
        return;
      }

      document.getElementById('requestCount').innerText = `${requests.length} Total Requests Recorded`;
      const tbody = document.getElementById('requestsTableBody');
      tbody.innerHTML = '';

      if (requests.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="color: var(--text-muted);">No requests found.</td></tr>';
        return;
      }

      requests.forEach(req => {
        const tr = document.createElement('tr');
        const dateStr = new Date(req.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        
        tr.innerHTML = `
          <td><strong>${req.full_name || 'Anonymous'}</strong><br><span style="font-size:0.75rem; color:var(--text-muted);">${req.email}</span></td>
          <td>${req.pet_name ? req.pet_name + ' (' + (req.breed || req.pet_type || 'Pet') + ')' : 'Unspecified'}</td>
          <td>${req.neighbourhood || 'Not specified'}</td>
          <td style="font-size:0.75rem; color:var(--text-muted);">${dateStr}</td>
          <td><button class="btn-match" onclick="runMatch('${req.id}', '${req.full_name}')">RUN MATCH</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function runMatch(requestId, clientName) {
      document.getElementById('matchmakerNotice').innerHTML = `Calculating best sitter matches for <strong>${clientName}</strong>...`;
      const matchesContainer = document.getElementById('matchesContainer');
      matchesContainer.innerHTML = '';

      try {
        const { data: matches, error } = await supabaseClient
          .rpc('match_sitters_for_request', { request_id: requestId });

        if (error) throw error;

        document.getElementById('matchmakerNotice').innerHTML = `Top Sitter Matches for <strong>${clientName}</strong>:`;

        matches.forEach(m => {
          const div = document.createElement('div');
          div.className = 'sitter-match-card';
          
          let reasonsHtml = '';
          if (m.match_reasons && m.match_reasons.length > 0) {
            m.match_reasons.forEach(r => {
              reasonsHtml += `<span class="tag">${r}</span>`;
            });
          } else {
            reasonsHtml = '<span style="font-size:0.75rem; color:var(--text-muted);">Standard profile match</span>';
          }

          div.innerHTML = `
            <div class="sitter-match-header">
              <div>
                <strong>${m.sitter_name}</strong>
                <div style="font-size:0.75rem; color:var(--text-muted);">${m.neighbourhood} &bull; $${m.nightly_rate}/night</div>
              </div>
              <div class="match-score">${m.match_score}%</div>
            </div>
            <div>${reasonsHtml}</div>
          `;
          matchesContainer.appendChild(div);
        });

      } catch (err) {
        console.error('Match error:', err);
        matchesContainer.innerHTML = `<div style="color:#E53E3E; font-size:0.85rem;">Error running match: ${err.message}</div>`;
      }
    }

    loadRequests();
  </script>

</body>
</html>
