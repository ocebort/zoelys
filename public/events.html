<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoélys — Curated Experiences</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #FAF6F0;
      --card-dark: #231C18;
      --card-white: #FFFFFF;
      --text-dark: #1C1613;
      --text-muted: #8E8883;
      --accent-coral: #D97757;
      --border-color: #EFEAE3;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Inter', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header.navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 3rem;
      background: var(--bg-cream);
      border-bottom: 1px solid var(--border-color);
    }

    .brand-logo {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--text-dark);
      text-decoration: none;
    }

    .back-link {
      color: var(--text-dark);
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .hero-banner {
      background-color: #201A17;
      color: #F7F3EC;
      text-align: center;
      padding: 4.5rem 1rem 5.5rem 1rem;
    }

    .hero-tag {
      color: var(--accent-coral);
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: 3.2rem;
      font-weight: 400;
      letter-spacing: 0.03em;
      margin-bottom: 0.75rem;
    }

    .hero-subtitle {
      color: #A39B93;
      font-size: 0.9rem;
      font-weight: 300;
    }

    main.events-grid {
      max-width: 1100px;
      margin: 3rem auto 5rem auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
      gap: 2rem;
      width: 100%;
    }

    .event-card {
      background: var(--card-white);
      border-radius: 1rem;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
    }

    .event-card-header {
      background: var(--card-dark);
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .calendar-icon { font-size: 2.5rem; color: var(--accent-coral); }
    .event-card-body { padding: 2rem; display: flex; flex-direction: column; flex: 1; }
    .event-tags { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent-coral); margin-bottom: 0.75rem; font-weight: 600; }
    .event-title { font-family: var(--font-serif); font-size: 1.8rem; font-weight: 500; margin-bottom: 0.75rem; line-height: 1.2; }
    .event-desc { color: var(--text-muted); font-size: 0.85rem; line-height: 1.6; margin-bottom: 1.5rem; }
    .event-meta { font-size: 0.8rem; color: var(--text-dark); display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1.5rem; }
    .event-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border-color); }
    .btn-reserve { background: var(--accent-coral); color: white; text-decoration: none; padding: 0.6rem 1.4rem; border-radius: 2rem; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }

    @media (max-width: 600px) { main.events-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header class="navbar">
    <a href="/" class="brand-logo">ZOÉLYS</a>
    <a href="/" class="back-link">&larr; BACK TO HOME</a>
  </header>

  <div class="hero-banner">
    <div class="hero-tag">CURATED EXPERIENCES</div>
    <h1 class="hero-title">Zoélys Events</h1>
    <p class="hero-subtitle">Curated experiences for you and your pet.</p>
  </div>

  <main class="events-grid" id="eventsGrid">
    <p style="text-align: center; color: var(--text-muted); grid-column: 1/-1;">Loading curated events from Cloudflare D1...</p>
  </main>

  <script>
    async function fetchEvents() {
      try {
        const res = await fetch('/api/events');
        const events = await res.json();
        const grid = document.getElementById('eventsGrid');

        if (events.length === 0) {
          grid.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 4rem 1rem;">
              <p style="font-family: var(--font-serif); font-size: 1.8rem; color: var(--text-dark); margin-bottom: 0.5rem;">No upcoming events listed</p>
              <p style="color: var(--text-muted); font-size: 0.9rem;">Add events inside your <a href="/admin" style="color: var(--accent-coral);">/admin CMS dashboard</a>!</p>
            </div>
          `;
          return;
        }

        grid.innerHTML = events.map(e => `
          <div class="event-card">
            <div class="event-card-header"><span class="calendar-icon">📅</span></div>
            <div class="event-card-body">
              <div class="event-tags">MIAMI • COMMUNITY</div>
              <h2 class="event-title">${e.title}</h2>
              <p class="event-desc">${e.description || 'Exclusive curated experience hosted by Zoélys.'}</p>
              <div class="event-meta">
                <div>📅 ${e.event_date}</div>
                <div>📍 ${e.location || 'Miami, FL'}</div>
              </div>
              <div class="event-footer">
                <a href="/get-matched" class="btn-reserve">RESERVE &rarr;</a>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) { console.error(err); }
    }
    fetchEvents();
  </script>

</body>
</html>
