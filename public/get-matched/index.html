<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Matched — Zoélys</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { cream: '#FAF6EE', card: '#FFFFFF', terracotta: '#D07358', terracottaHover: '#B85E45', dark: '#1F1916', muted: '#8A827A' } },
          fontFamily: { serif: ['Cormorant Garamond', 'serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-cream text-brand-dark font-sans antialiased">
  <header class="w-full bg-brand-cream border-b border-stone-200/60 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-8 h-20 flex items-center justify-between">
      <a href="/" class="font-serif text-2xl tracking-[0.25em] font-normal uppercase">ZOÉLYS</a>
      <a href="/" class="text-xs uppercase tracking-widest text-stone-500 hover:text-brand-dark">← Exit</a>
    </div>
  </header>

  <section class="bg-brand-dark text-white py-12 text-center space-y-2">
    <p class="text-[10px] uppercase tracking-[0.3em] text-brand-terracotta">— Your Request —</p>
    <h1 class="font-serif text-4xl font-normal">Tell us about your pet</h1>
  </section>

  <main class="max-w-xl mx-auto px-6 py-12">
    <!-- Progress Indicator -->
    <div class="flex justify-between items-center text-[10px] uppercase tracking-[0.2em] text-brand-muted mb-6">
      <span id="step-indicator">Step 1 of 7</span>
      <span id="step-title" class="text-brand-terracotta font-medium">About You</span>
    </div>

    <!-- Multi-step Form Card -->
    <form id="matching-form" class="bg-brand-card p-8 md:p-10 rounded-2xl border border-stone-200/80 shadow-sm space-y-6">
      
      <!-- Step 1: About You -->
      <div id="step-1" class="step-content space-y-4">
        <h2 class="font-serif text-3xl font-normal">Step 1. About You</h2>
        <div>
          <label class="block text-xs uppercase tracking-wider text-stone-600 mb-1">Full Name</label>
          <input type="text" required class="w-full bg-brand-cream/50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta" />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-stone-600 mb-1">Email</label>
          <input type="email" required class="w-full bg-brand-cream/50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta" />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-stone-600 mb-1">Phone</label>
          <input type="tel" required class="w-full bg-brand-cream/50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta" />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-stone-600 mb-1">Neighbourhood / Area</label>
          <input type="text" placeholder="e.g. Brickell, Miami" required class="w-full bg-brand-cream/50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta" />
        </div>
      </div>

      <!-- Step 2: Pet Basics -->
      <div id="step-2" class="step-content hidden space-y-4">
        <h2 class="font-serif text-3xl font-normal">Step 2. Pet Basics</h2>
        <div>
          <label class="block text-xs uppercase tracking-wider text-stone-600 mb-1">Pet Name</label>
          <input type="text" placeholder="e.g. Milo" class="w-full bg-brand-cream/50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta" />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-stone-600 mb-1">Species</label>
          <select class="w-full bg-brand-cream/50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta">
            <option>Dog</option><option>Cat</option><option>Other</option>
          </select>
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-stone-600 mb-1">Breed & Age</label>
          <input type="text" placeholder="e.g. Golden Retriever, 3 years" class="w-full bg-brand-cream/50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta" />
        </div>
      </div>

      <!-- Step 3: Service Needed -->
      <div id="step-3" class="step-content hidden space-y-4">
        <h2 class="font-serif text-3xl font-normal">Step 3. Service Type</h2>
        <div class="space-y-3">
          <label class="flex items-center space-x-3 p-4 border border-stone-200 rounded-xl cursor-pointer hover:bg-brand-cream/50">
            <input type="radio" name="service" checked class="accent-brand-terracotta" />
            <span class="text-sm font-medium">Overnight House Sitting</span>
          </label>
          <label class="flex items-center space-x-3 p-4 border border-stone-200 rounded-xl cursor-pointer hover:bg-brand-cream/50">
            <input type="radio" name="service" class="accent-brand-terracotta" />
            <span class="text-sm font-medium">Daily Drop-in Visits</span>
          </label>
          <label class="flex items-center space-x-3 p-4 border border-stone-200 rounded-xl cursor-pointer hover:bg-brand-cream/50">
            <input type="radio" name="service" class="accent-brand-terracotta" />
            <span class="text-sm font-medium">Dog Walking</span>
          </label>
        </div>
      </div>

      <!-- Step 4: Dates & Schedule -->
      <div id="step-4" class="step-content hidden space-y-4">
        <h2 class="font-serif text-3xl font-normal">Step 4. Dates & Schedule</h2>
        <div>
          <label class="block text-xs uppercase tracking-wider text-stone-600 mb-1">Start Date</label>
          <input type="date" class="w-full bg-brand-cream/50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta" />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-stone-600 mb-1">End Date</label>
          <input type="date" class="w-full bg-brand-cream/50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta" />
        </div>
      </div>

      <!-- Step 5: Behavioral Quirks -->
      <div id="step-5" class="step-content hidden space-y-4">
        <h2 class="font-serif text-3xl font-normal">Step 5. Quirks & Temperament</h2>
        <div>
          <label class="block text-xs uppercase tracking-wider text-stone-600 mb-1">How do they react to strangers / other pets?</label>
          <textarea rows="3" placeholder="e.g. Shy at first, loves treats, gets nervous around thunderstorms..." class="w-full bg-brand-cream/50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta"></textarea>
        </div>
      </div>

      <!-- Step 6: Medical & Routine -->
      <div id="step-6" class="step-content hidden space-y-4">
        <h2 class="font-serif text-3xl font-normal">Step 6. Medical & Dietary Routine</h2>
        <div>
          <label class="block text-xs uppercase tracking-wider text-stone-600 mb-1">Special instructions or medicine schedule</label>
          <textarea rows="3" placeholder="e.g. 1 pill at 8 AM, food served wet with warm water..." class="w-full bg-brand-cream/50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta"></textarea>
        </div>
      </div>

      <!-- Step 7: Preferences & Submit -->
      <div id="step-7" class="step-content hidden space-y-4">
        <h2 class="font-serif text-3xl font-normal">Step 7. Match Preferences</h2>
        <div>
          <label class="block text-xs uppercase tracking-wider text-stone-600 mb-1">Any specific sitter qualities you prefer?</label>
          <textarea rows="3" placeholder="e.g. Quiet home environment, experienced with senior dogs..." class="w-full bg-brand-cream/50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta"></textarea>
        </div>
      </div>

      <!-- Navigation Buttons -->
      <div class="flex justify-between items-center pt-4 border-t border-stone-100">
        <button type="button" id="prev-btn" class="hidden text-xs uppercase tracking-widest font-medium text-stone-500 hover:text-brand-dark">← Back</button>
        <button type="button" id="next-btn" class="ml-auto bg-brand-terracotta hover:bg-brand-terracottaHover text-white px-8 py-3.5 rounded-full text-xs uppercase tracking-[0.2em] font-medium shadow-md transition-all">
          Continue ↗
        </button>
      </div>
    </form>
  </main>

  <script>
    let currentStep = 1;
    const titles = ["About You", "Pet Basics", "Service Type", "Dates & Schedule", "Quirks & Temperament", "Medical & Dietary", "Match Preferences"];
    
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const indicator = document.getElementById("step-indicator");
    const titleEl = document.getElementById("step-title");

    function updateStep() {
      document.querySelectorAll(".step-content").forEach((el, idx) => {
        el.classList.toggle("hidden", idx + 1 !== currentStep);
      });
      indicator.textContent = `Step ${currentStep} of 7`;
      titleEl.textContent = titles[currentStep - 1];
      prevBtn.classList.toggle("hidden", currentStep === 1);
      nextBtn.textContent = currentStep === 7 ? "Submit Request ↗" : "Continue ↗";
    }

    nextBtn.addEventListener("click", () => {
      if (currentStep < 7) {
        currentStep++;
        updateStep();
      } else {
        alert("Request Submitted! We will handpick your sitter match within 24 hours.");
        window.location.href = "/";
      }
    });

    prevBtn.addEventListener("click", () => {
      if (currentStep > 1) {
        currentStep--;
        updateStep();
      }
    });
  </script>
</body>
</html>
