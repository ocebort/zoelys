<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoélys — Concierge Sitter Intake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #FAF6F0;
      --card-white: #FFFFFF;
      --text-dark: #1C1613;
      --text-muted: #8E8883;
      --accent-coral: #D97757;
      --border-color: #EFEAE3;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Inter', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* MASTER UNIFIED NAVBAR (EXACT HOMEPAGE MATCH) */
    header.master-navbar {
      width: 100%;
      background: var(--bg-cream);
      padding: 1.5rem 4rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--text-dark);
      text-decoration: none;
    }

    .nav-center { display: flex; gap: 2rem; list-style: none; }
    .nav-center a, .nav-right a {
      color: var(--text-dark);
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 500;
      white-space: nowrap;
    }

    .nav-right { display: flex; gap: 1.5rem; align-items: center; list-style: none; }
    
    .btn-join-pill {
      background: var(--accent-coral);
      color: white !important;
      padding: 0.65rem 1.4rem;
      border-radius: 2rem;
      font-weight: 600;
    }

    /* FORM CONTAINER */
    main.form-container {
      max-width: 640px;
      width: 90%;
      margin: 3rem auto 5rem auto;
    }

    .progress-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent-coral);
      border-bottom: 1px solid #E5DFD5;
      padding-bottom: 0.5rem;
      margin-bottom: 2rem;
      font-weight: 600;
    }

    .form-card {
      background: var(--card-white);
      border-radius: 1rem;
      padding: 2.5rem;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0,0,0,0.02);
    }

    .form-card h2 {
      font-family: var(--font-serif);
      font-size: 2.4rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .form-subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }

    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.4rem; }
    .form-group input, .form-group select {
      width: 100%; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 0.5rem; font-family: var(--font-sans); outline: none; background: #FAF8F5;
    }

    .btn-submit {
      background: #1C1613;
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 1rem;
    }

    @media (max-width: 768px) {
      .nav-center { display: none; }
      header.master-navbar { padding: 1rem 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- MASTER NAVBAR (CENTERED & MATCHES HOMEPAGE EXACTLY) -->
  <header class="master-navbar">
    <a href="/" class="brand-logo">ZOÉLYS</a>
    <ul class="nav-center">
      <li><a href="/get-matched" style="color: var(--accent-coral);">FIND A SITTER</a></li>
      <li><a href="/#how-it-works">HOW IT WORKS</a></li>
      <li><a href="/#journal">JOURNAL</a></li>
      <li><a href="/#map">MAP</a></li>
      <li><a href="/events">EVENTS</a></li>
      <li><a href="/partners">PARTNERS</a></li>
    </ul>
    <ul class="nav-right">
      <li><a href="/dashboard">SIGN IN</a></li>
      <li><a href="/get-matched" class="btn-join-pill">JOIN ZOÉLYS</a></li>
    </ul>
  </header>

  <main class="form-container">
    <div class="progress-bar">
      <span>STEP 1 OF 1</span>
      <span>PET CONCIERGE MATCHING INTAKE</span>
    </div>

    <div class="form-card">
      <h2>Curated Sitter Intake</h2>
      <p class="form-subtitle">Tell us about your companion. We will create your pet manual and pair you with a handpicked sitter within 24 hours.</p>
      
      <form onsubmit="submitForm(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="fullName" placeholder="Océane Bort" required>
        </div>

        <div class="form-group">
          <label>Email Address (Used for Account Access)</label>
          <input type="email" id="email" placeholder="oceane@zoelys.com" required>
        </div>

        <div class="form-group">
          <label>Create Account Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label>Subscription Plan / Credit Bundle</label>
          <select id="tier">
            <option value="Gold ($65/mo)">Gold — $65/mo (5 Credits)</option>
            <option value="Platinum ($125/mo)" selected>Platinum — $125/mo (10 Credits)</option>
            <option value="Diamond ($180/mo)">Diamond — $180/mo (15 Credits)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Neighbourhood / Area in Miami</label>
          <input type="text" id="neighbourhood" placeholder="e.g. Brickell, Coconut Grove" required>
        </div>

        <div class="form-group">
          <label>Pet Name</label>
          <input type="text" id="petName" placeholder="e.g. Zoé" required>
        </div>

        <div class="form-group">
          <label>Pet Species</label>
          <select id="petType">
            <option value="Dog">Dog</option>
            <option value="Cat">Cat</option>
          </select>
        </div>

        <div class="form-group">
          <label>Medical Needs / Medications</label>
          <input type="text" id="medical" placeholder="Daily vitamins, anxiety meds, or None">
        </div>

        <button type="submit" class="btn-submit">SUBMIT & UNLOCK CONCIERGE PORTAL &rarr;</button>
      </form>
    </div>
  </main>

  <script>
    async function submitForm(e) {
      e.preventDefault();
      
      const payload = {
        full_name: document.getElementById('fullName').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        tier: document.getElementById('tier').value,
        pet_name: document.getElementById('petName').value,
        species: document.getElementById('petType').value,
        medical_needs: document.getElementById('medical').value,
        neighbourhood: document.getElementById('neighbourhood').value
      };

      try {
        const regRes = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const regData = await regRes.json();

        await fetch('/api/requests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (regData.userId) {
          localStorage.setItem('zoelys_user_id', regData.userId);
          alert('✨ Concierge Profile & Pet Manual Created! Welcome to Zoélys.');
          window.location.href = '/dashboard';
        } else {
          alert('Note: Account exists. Logging you into dashboard.');
          window.location.href = '/dashboard';
        }
      } catch (err) {
        alert('Error connecting to Cloudflare Worker.');
      }
    }
  </script>
</body>
</html>
