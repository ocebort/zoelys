<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Map — Zoélys</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>tailwind.config = { theme: { extend: { colors: { brand: { cream: '#FAF6EE', card: '#FFFFFF', terracotta: '#D07358', dark: '#1F1916', muted: '#8A827A' } }, fontFamily: { serif: ['Cormorant Garamond', 'serif'], sans: ['Inter', 'sans-serif'] } } } }</script>
</head>
<body class="bg-brand-cream text-brand-dark font-sans antialiased">
  <header class="w-full bg-brand-cream border-b border-stone-200/60 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-8 h-20 flex items-center justify-between">
      <a href="/" class="font-serif text-2xl tracking-[0.25em] uppercase">ZOÉLYS</a>
      <a href="/get-matched" class="bg-brand-terracotta text-white px-6 py-3 rounded-full text-[11px] uppercase tracking-[0.2em]">Join Zoélys</a>
    </div>
  </header>
  <section class="bg-brand-dark text-white py-12 text-center space-y-2">
    <p class="text-[10px] uppercase tracking-[0.3em] text-brand-terracotta">— Explore —</p>
    <h1 class="font-serif text-5xl font-normal">The Zoélys map of Miami</h1>
    <p class="text-xs text-stone-400 max-w-md mx-auto">Vetted vets, groomers, cafés and parks in Coconut Grove, Brickell and South Beach.</p>
  </section>
  <main class="relative h-[650px] w-full">
    <div id="map" class="w-full h-full"></div>
  </main>
  <script>
    const map = L.map('map').setView([25.7617, -80.1918], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    L.marker([25.7617, -80.1918]).addTo(map).bindPopup('<b>Brickell Vet Hospital</b>');
    L.marker([25.7132, -80.2575]).addTo(map).bindPopup('<b>Coconut Grove Dog Park</b>');
  </script>
</body>
</html>
