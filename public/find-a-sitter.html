<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find a Sitter — Zoélys</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { cream: '#FAF7F2', card: '#F4EFEA', terracotta: '#D07358', dark: '#1C1917', muted: '#78716C' } },
          fontFamily: { serif: ['Cormorant Garamond', 'serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-cream text-brand-dark font-sans antialiased">
  <header class="w-full border-b border-stone-200/80 bg-brand-cream/90 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="index.html" class="font-serif text-2xl tracking-[0.2em] uppercase">ZOÉLYS</a>
      <nav class="hidden md:flex space-x-8 text-xs tracking-widest uppercase font-medium text-stone-600">
        <a href="find-a-sitter.html" class="text-brand-terracotta">Find a Sitter</a>
        <a href="map.html" class="hover:text-brand-dark">The Map</a>
        <a href="events.html" class="hover:text-brand-dark">Events</a>
        <a href="partners.html" class="hover:text-brand-dark">Partners</a>
        <a href="journal.html" class="hover:text-brand-dark">Journal</a>
      </nav>
      <a href="find-a-sitter.html" class="bg-brand-terracotta text-white px-5 py-2.5 rounded-full text-xs tracking-widest uppercase font-medium">Join Zoélys</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-16">
    <div class="text-center space-y-3 mb-12">
      <p class="text-xs uppercase tracking-[0.3em] text-brand-muted">— Care Match Brief</p>
      <h1 class="font-serif text-5xl font-normal">Tell us about your companion.</h1>
      <p class="text-sm text-brand-muted font-light">We handpick the single best sitter for your pet within 24 hours.</p>
    </div>

    <form onsubmit="event.preventDefault(); alert('Request submitted! We will send your sitter match within 24 hours.');" class="bg-brand-card p-8 md:p-12 rounded-2xl border border-stone-200/80 space-y-6">
      <div>
        <label class="block text-xs uppercase tracking-widest font-medium text-stone-600 mb-2">Pet's Name</label>
        <input type="text" required placeholder="e.g. Milo" class="w-full bg-white border border-stone-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta" />
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-xs uppercase tracking-widest font-medium text-stone-600 mb-2">Species</label>
          <select class="w-full bg-white border border-stone-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta">
            <option>Dog</option>
            <option>Cat</option>
            <option>Other companion</option>
          </select>
        </div>
        <div>
          <label class="block text-xs uppercase tracking-widest font-medium text-stone-600 mb-2">Neighborhood / Area</label>
          <input type="text" required placeholder="e.g. Brickell, Miami" class="w-full bg-white border border-stone-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta" />
        </div>
      </div>

      <div>
        <label class="block text-xs uppercase tracking-widest font-medium text-stone-600 mb-2">Care Quirks, Habits & Special Notes</label>
        <textarea rows="4" placeholder="Tell us about feeding schedules, fears, favorite routines..." class="w-full bg-white border border-stone-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta"></textarea>
      </div>

      <button type="submit" class="w-full bg-brand-terracotta hover:bg-stone-800 text-white py-4 rounded-full text-xs uppercase tracking-widest font-medium transition-all duration-300 shadow-md">
        Request My Match ↗
      </button>
    </form>
  </main>
</body>
</html>
