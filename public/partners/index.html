<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partners — Zoélys</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>tailwind.config = { theme: { extend: { colors: { brand: { cream: '#FAF6EE', card: '#FFFFFF', terracotta: '#D07358', dark: '#1F1916', muted: '#8A827A' } }, fontFamily: { serif: ['Cormorant Garamond', 'serif'], sans: ['Inter', 'sans-serif'] } } } }</script>
</head>
<body class="bg-brand-cream text-brand-dark font-sans antialiased">
  <header class="w-full bg-brand-cream border-b border-stone-200/60 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-8 h-20 flex items-center justify-between">
      <a href="/" class="font-serif text-2xl tracking-[0.25em] uppercase">ZOÉLYS</a>
      <a href="/get-matched" class="bg-brand-terracotta text-white px-6 py-3 rounded-full text-[11px] uppercase tracking-[0.2em]">Join Zoélys</a>
    </div>
  </header>
  <main class="max-w-5xl mx-auto px-6 py-16">
    <div class="text-center mb-12"><h1 class="font-serif text-5xl">Our Trusted Partners</h1></div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-brand-card p-6 rounded-2xl border border-stone-200"><h3 class="font-serif text-2xl">Brickell Animal Hospital</h3><p class="text-xs text-brand-terracotta uppercase mt-1">24/7 Emergency Partner</p></div>
      <div class="bg-brand-card p-6 rounded-2xl border border-stone-200"><h3 class="font-serif text-2xl">Aura Organic Pet Food</h3><p class="text-xs text-brand-terracotta uppercase mt-1">Holistic Nutrition</p></div>
    </div>
  </main>
</body>
</html>
