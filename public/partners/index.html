<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoélys — Preferred Partners & Perks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">

  <style>
    main.container { max-width: 1100px; width: 100%; margin: 3rem auto 6rem auto; padding: 0 1.5rem; }
    .hero-sec { text-align: center; margin-bottom: 3rem; }
    .hero-sec h1 { font-family: var(--font-serif); font-size: 3.2rem; font-weight: 400; margin-bottom: 0.5rem; }

    .filter-pills { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin-bottom: 3rem; }
    .filter-pill { background: #FAF8F5; color: #1C1613; border: 1px solid #EFEAE3; padding: 0.6rem 1.4rem; border-radius: 2rem; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .filter-pill.active { background: #1C1613; color: white; border-color: #1C1613; }

    .partners-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; }
    .partner-card { background: white; border: 1px solid #EFEAE3; border-radius: 1rem; overflow: hidden; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.02); display: flex; flex-direction: column; justify-content: space-between; }
  </style>
</head>
<body>

  <main class="container">
    <div class="hero-sec">
      <div style="font-size: 0.75rem; letter-spacing: 0.15em; color: var(--accent-coral); font-weight: 600; text-transform: uppercase;">VIP BENEFITS</div>
      <h1>Preferred Partners & Perks</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Exclusive discounts, priority appointments, and complimentary upgrades across Miami.</p>
    </div>

    <!-- FILTER PILLS -->
    <div class="filter-pills">
      <button class="filter-pill active" onclick="filterPartners('All', this)">All Partners</button>
      <button class="filter-pill" onclick="filterPartners('Veterinary Care', this)">Veterinary Care</button>
      <button class="filter-pill" onclick="filterPartners('Luxury Grooming', this)">Luxury Grooming</button>
      <button class="filter-pill" onclick="filterPartners('Boutique Hotels', this)">Boutique Hotels</option>
      <button class="filter-pill" onclick="filterPartners('Pet Dining & Treats', this)">Dining & Treats</button>
    </div>

    <!-- DYNAMIC PARTNERS GRID -->
    <div class="partners-grid" id="partnersContainer">
      <div style="text-align: center; grid-column: 1/-1; padding: 3rem; color: var(--text-muted);">Loading partner perks...</div>
    </div>
  </main>

  <script src="/navbar.js"></script>
  <script>
    let allPartners = [];

    async function fetchPartners() {
      try {
        const res = await fetch('/api/partners');
        const data = await res.json();
        allPartners = data.partners || data;
        renderPartners(allPartners);
      } catch (e) {
        document.getElementById('partnersContainer').innerHTML = '<div style="text-align: center; grid-column: 1/-1; color: var(--text-muted);">Unable to load partners.</div>';
      }
    }

    function renderPartners(list) {
      const container = document.getElementById('partnersContainer');
      if (!list || list.length === 0) {
        container.innerHTML = '<div style="text-align: center; grid-column: 1/-1; padding: 4rem; color: var(--text-muted);">No partners found in this category.</div>';
        return;
      }

      container.innerHTML = list.map(p => `
        <div class="partner-card">
          <div>
            ${p.image_url ? `<img src="${p.image_url}" style="width: 100%; height: 160px; object-fit: cover; border-radius: 0.5rem; margin-bottom: 1.25rem;">` : ''}
            <div style="font-size: 0.7rem; letter-spacing: 0.12em; color: var(--accent-coral); font-weight: 600; text-transform: uppercase;">${p.category || 'LUXURY CARE'}</div>
            <h3 style="font-family: var(--font-serif); font-size: 1.8rem; margin: 0.3rem 0;">${p.name}</h3>
            <div style="font-size: 0.85rem; color: var(--text-dark); font-weight: 600; margin-bottom: 0.8rem;">💎 ${p.perk || 'Exclusive Perk'}</div>
            <p style="font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 1.5rem;">${p.description || ''}</p>
          </div>
          <a href="${p.website_url || '#'}" target="_blank" style="background: #1C1613; color: white; text-align: center; padding: 0.7rem; border-radius: 2rem; font-size: 0.75rem; font-weight: 600; text-decoration: none; text-transform: uppercase; letter-spacing: 0.1em; display: block;">REDEEM MEMBER PERK &rarr;</a>
        </div>
      `).join('');
    }

    function filterPartners(category, btn) {
      document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (category === 'All') renderPartners(allPartners);
      else renderPartners(allPartners.filter(p => (p.category || '').toLowerCase() === category.toLowerCase()));
    }

    document.addEventListener('DOMContentLoaded', fetchPartners);
  </script>
</body>
</html>
