<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoélys — Our Partner Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #FAF6F0;
      --card-dark: #201A17;
      --card-white: #FFFFFF;
      --text-dark: #1C1613;
      --text-muted: #8E8883;
      --accent-coral: #D97757;
      --border-color: #EFEAE3;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Inter', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header.navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 3rem;
      background: var(--bg-cream);
      border-bottom: 1px solid var(--border-color);
    }

    .brand-logo {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--text-dark);
      text-decoration: none;
    }

    .back-link {
      color: var(--text-dark);
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .hero-banner {
      background-color: #201A17;
      color: #F7F3EC;
      text-align: center;
      padding: 4.5rem 1rem 5.5rem 1rem;
    }

    .hero-tag {
      color: var(--accent-coral);
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: 3.2rem;
      font-weight: 400;
      letter-spacing: 0.03em;
      margin-bottom: 0.75rem;
    }

    .hero-subtitle {
      color: #A39B93;
      font-size: 0.9rem;
      font-weight: 300;
    }

    main.partners-grid {
      max-width: 1100px;
      margin: 3rem auto 5rem auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
      width: 100%;
    }

    .partner-card {
      background: var(--card-white);
      border-radius: 1rem;
      padding: 2rem;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .badge-approved {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: #1C1613;
      color: #FAF6F0;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      padding: 0.3rem 0.6rem;
      border-radius: 1rem;
      text-transform: uppercase;
    }

    .logo-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #1C1613;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-size: 1.4rem;
      margin-bottom: 1.5rem;
    }

    .partner-category {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent-coral);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .partner-name {
      font-family: var(--font-serif);
      font-size: 1.7rem;
      font-weight: 500;
      margin-bottom: 0.75rem;
    }

    .partner-desc {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .partner-link {
      color: var(--text-dark);
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
    }

    @media (max-width: 600px) { main.partners-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header class="navbar">
    <a href="/" class="brand-logo">ZOÉLYS</a>
    <a href="/" class="back-link">&larr; BACK TO HOME</a>
  </header>

  <div class="hero-banner">
    <div class="hero-tag">A CURATED CIRCLE</div>
    <h1 class="hero-title">Our Partners</h1>
    <p class="hero-subtitle">Every partner is personally selected by the Zoélys team.</p>
  </div>

  <main class="partners-grid" id="partnersGrid">
    <p style="text-align: center; color: var(--text-muted); grid-column: 1/-1;">Loading partner network from Cloudflare D1...</p>
  </main>

  <script>
    async function fetchPartners() {
      try {
        const res = await fetch('/api/partners');
        const partners = await res.json();
        const grid = document.getElementById('partnersGrid');

        if (partners.length === 0) {
          grid.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 4rem 1rem;">
              <p style="font-family: var(--font-serif); font-size: 1.8rem; color: var(--text-dark); margin-bottom: 0.5rem;">No partner network items listed</p>
              <p style="color: var(--text-muted); font-size: 0.9rem;">Add partners inside your <a href="/admin" style="color: var(--accent-coral);">/admin CMS dashboard</a>!</p>
            </div>
          `;
          return;
        }

        grid.innerHTML = partners.map(p => `
          <div class="partner-card">
            <span class="badge-approved">ZOÉLYS APPROVED</span>
            <div>
              <div class="logo-circle">${p.name.charAt(0)}</div>
              <div class="partner-category">${p.category || 'LUXURY CONCIERGE'}</div>
              <h2 class="partner-name">${p.name}</h2>
              <p class="partner-desc">Hand-selected luxury partner offering premier services to Zoélys members in Miami.</p>
            </div>
            <div>
              <a href="${p.website_url || '#'}" target="_blank" class="partner-link">Discover &rarr;</a>
            </div>
          </div>
        `).join('');
      } catch (err) { console.error(err); }
    }
    fetchPartners();
  </script>

<script src="/navbar.js"></script></body>
</html>
