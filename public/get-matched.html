<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoélys Concierge — Find Your Sitter Match</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #1C1613;
      --bg-card: #251F1B;
      --border-color: #38312C;
      --accent-coral: #D97757;
      --text-main: #F7F3EC;
      --text-muted: #A39D95;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Inter', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      padding: 2.5rem;
      width: 100%;
      max-width: 550px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    input, select {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border-color);
      background: #120E0C;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-coral);
    }

    .pill-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .pill-btn {
      background: #120E0C;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: 1.5rem;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
    }

    .pill-btn.active {
      background: var(--accent-coral);
      border-color: var(--accent-coral);
      color: white;
    }

    .btn-submit {
      width: 100%;
      background: var(--accent-coral);
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 1rem;
    }

    #successMsg {
      display: none;
      text-align: center;
      color: var(--accent-coral);
      font-size: 1.1rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <h1>ZOÉLYS</h1>
    <p class="subtitle">Personalized Pet Concierge Intake</p>

    <form id="intakeForm" onsubmit="submitForm(event)">
      <div class="form-group">
        <label>Your Full Name</label>
        <input type="text" id="fullName" placeholder="e.g. Océane Bort-Aponte" required>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="e.g. oceane@zoelys.com" required>
      </div>

      <div class="form-group">
        <label>Neighbourhood</label>
        <select id="neighbourhood">
          <option value="Brickell">Brickell</option>
          <option value="Coconut Grove">Coconut Grove</option>
          <option value="South Beach">South Beach</option>
          <option value="Wynwood">Wynwood</option>
        </select>
      </div>

      <div class="form-group">
        <label>Pet Type</label>
        <div class="pill-group">
          <div class="pill-btn active" onclick="selectPill(this, 'petType', 'Dog')">Dog</div>
          <div class="pill-btn" onclick="selectPill(this, 'petType', 'Cat')">Cat</div>
        </div>
      </div>

      <div class="form-group">
        <label>Pet Name</label>
        <input type="text" id="petName" placeholder="e.g. Bella">
      </div>

      <div class="form-group">
        <label>Special Medical Conditions?</label>
        <select id="medicalConditions">
          <option value="No">No medical conditions</option>
          <option value="Yes">Requires medication / Special care</option>
        </select>
      </div>

      <div class="form-group">
        <label>Private Outdoor Space Needed?</label>
        <select id="outdoorSpace">
          <option value="No">No preference</option>
          <option value="Yes">Yes (Private Backyard Required)</option>
        </select>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">FIND MY MATCH</button>
    </form>

    <div id="successMsg">
      ✨ <strong>Request Submitted!</strong><br>
      <span style="font-size: 0.85rem; color: var(--text-muted);">Our concierge team is evaluating your top sitter matches in Cloudflare D1...</span>
    </div>
  </div>

  <script>
    let selectedPetType = 'Dog';

    function selectPill(el, group, val) {
      document.querySelectorAll('.pill-group .pill-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      selectedPetType = val;
    }

    async function submitForm(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = 'MATCHING...';
      btn.disabled = true;

      const payload = {
        full_name: document.getElementById('fullName').value,
        email: document.getElementById('email').value,
        neighbourhood: document.getElementById('neighbourhood').value,
        pet_type: selectedPetType,
        pet_name: document.getElementById('petName').value,
        medical_conditions: document.getElementById('medicalConditions').value,
        outdoor_space: document.getElementById('outdoorSpace').value,
        behavioral_traits: ['Separation anxiety'],
        experience_level: 'Vet Tech Preferred'
      };

      try {
        const response = await fetch('/api/requests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          document.getElementById('intakeForm').style.display = 'none';
          document.getElementById('successMsg').style.display = 'block';
        } else {
          alert('Error submitting request to Cloudflare D1.');
          btn.innerText = 'FIND MY MATCH';
          btn.disabled = false;
        }
      } catch (err) {
        console.error(err);
        alert('Network error. Check console.');
        btn.innerText = 'FIND MY MATCH';
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
