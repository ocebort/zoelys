<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Matched — Zoélys</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { cream: '#FAF6EE', card: '#FFFFFF', terracotta: '#D07358', dark: '#1F1916', muted: '#8A827A' } },
          fontFamily: { serif: ['Cormorant Garamond', 'serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-cream text-brand-dark font-sans antialiased">

  <header class="w-full bg-brand-cream border-b border-stone-200/60 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="font-serif text-2xl tracking-[0.25em] font-normal uppercase">ZOÉLYS</a>
      <nav class="hidden lg:flex items-center space-x-10 text-[11px] tracking-[0.2em] uppercase font-medium text-stone-600">
        <a href="get-matched.html" class="text-brand-terracotta">Find a Sitter</a>
        <a href="how-it-works.html">How It Works</a>
        <a href="journal.html">Journal</a>
        <a href="map.html">Explore ▾</a>
      </nav>
      <a href="get-matched.html" class="bg-brand-terracotta text-white px-6 py-3 rounded-full text-[11px] tracking-[0.2em] uppercase font-medium">Join Zoélys</a>
    </div>
  </header>

  <section class="bg-brand-dark text-white py-16 text-center space-y-3">
    <p class="text-[10px] uppercase tracking-[0.3em] text-brand-terracotta">— Your Request —</p>
    <h1 class="font-serif text-5xl font-normal">Tell us about your pet</h1>
  </section>

  <main class="max-w-2xl mx-auto px-6 -mt-6 py-12">
    <form onsubmit="event.preventDefault(); alert('Request submitted! We will handpick your sitter match within 24 hours.');" class="bg-brand-card p-10 rounded-2xl border border-stone-200/80 shadow-sm space-y-8">
      
      <!-- Step 1 -->
      <div class="space-y-4">
        <div class="flex justify-between items-center text-[10px] uppercase tracking-[0.2em] text-brand-muted">
          <span>Step 1 of 7</span>
          <span class="text-brand-terracotta font-medium">About You</span>
        </div>
        <h2 class="font-serif text-3xl font-normal">1. Owner Details</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input type="text" placeholder="Full Name" required class="bg-brand-cream/50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta" />
          <input type="email" placeholder="Email Address" required class="bg-brand-cream/50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta" />
        </div>
      </div>

      <!-- Step 2 -->
      <div class="space-y-4 border-t border-stone-100 pt-6">
        <div class="flex justify-between items-center text-[10px] uppercase tracking-[0.2em] text-brand-muted">
          <span>Step 2 of 7</span>
          <span class="text-brand-terracotta font-medium">Pet Basics</span>
        </div>
        <h2 class="font-serif text-3xl font-normal">2. Companion Profile</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input type="text" placeholder="Pet Name (e.g. Milo)" required class="bg-brand-cream/50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta" />
          <select class="bg-brand-cream/50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta">
            <option>Dog</option>
            <option>Cat</option>
            <option>Other companion</option>
          </select>
        </div>
      </div>

      <!-- Step 3 & 4 -->
      <div class="space-y-4 border-t border-stone-100 pt-6">
        <div class="flex justify-between items-center text-[10px] uppercase tracking-[0.2em] text-brand-muted">
          <span>Steps 3-7</span>
          <span class="text-brand-terracotta font-medium">Care Brief</span>
        </div>
        <h2 class="font-serif text-3xl font-normal">3. Dates & Special Needs</h2>
        <input type="text" placeholder="Neighborhood / Area (e.g. Brickell)" required class="w-full bg-brand-cream/50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta" />
        <textarea rows="4" placeholder="Feeding routines, anxiety triggers, vet info, medication..." class="w-full bg-brand-cream/50 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-terracotta"></textarea>
      </div>

      <button type="submit" class="w-full bg-brand-terracotta hover:bg-brand-terracottaHover text-white py-4 rounded-full text-xs uppercase tracking-[0.2em] font-medium transition-all shadow-md">
        Submit Request ↗
      </button>
    </form>
  </main>

</body>
</html>
