<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Zoélys — Member Portal</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FAF8F5;
      color: #191512;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 460px;
      background: #FFFFFF;
      border: 1px solid #EBE6DF;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 4px 24px rgba(25, 21, 18, 0.04);
      box-sizing: border-box;
    }
    h1 {
      font-family: "Baskerville", "Garamond", serif;
      font-size: 28px;
      font-weight: normal;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    p.subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .field-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      color: #666;
    }
    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #EBE6DF;
      border-radius: 6px;
      font-size: 14px;
      background: #FAF8F5;
      color: #191512;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: #191512;
      background: #FFFFFF;
    }
    .role-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .role-btn {
      padding: 10px 4px;
      border: 1px solid #EBE6DF;
      background: #FAF8F5;
      color: #191512;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .role-btn.active {
      background: #191512;
      color: #FAF8F5;
      border-color: #191512;
    }
    button.submit-btn {
      width: 100%;
      background: #191512;
      color: #FAF8F5;
      border: none;
      padding: 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    button.submit-btn:hover {
      opacity: 0.9;
    }
    .error-msg {
      color: #B33A3A;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .footer-link {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: #666;
    }
    .footer-link a {
      color: #191512;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container" id="formContainer">
    <h1>Create Account</h1>
    <p class="subtitle">Join Zoélys for premier, high-trust care and membership management.</p>
    
    <div id="errorAlert" class="error-msg"></div>

    <form id="registerForm">
      <div class="field-group">
        <label>I am joining as a:</label>
        <div class="role-toggle">
          <button type="button" class="role-btn active" id="btnOwner" onclick="setRole('owner')">Pet Parent</button>
          <button type="button" class="role-btn" id="btnSitter" onclick="setRole('sitter')">Pet Sitter</button>
          <button type="button" class="role-btn" id="btnBoth" onclick="setRole('both')">Both</button>
        </div>
      </div>

      <div class="field-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" required placeholder="Océane Dupont">
      </div>

      <div class="field-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="oceane@example.com">
      </div>

      <div class="field-group">
        <label for="password">Password (8+ characters)</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <div class="field-group">
        <label for="confirmPassword">Retype Password</label>
        <input type="password" id="confirmPassword" required placeholder="••••••••">
      </div>

      <div class="field-group" id="tierGroup">
        <label for="tier">Membership Plan</label>
        <select id="tier">
          <option value="Gold">Gold — €99 / mo (20 credits/mo, 60-day rollover)</option>
          <option value="Platinum" selected>Platinum — €249 / mo (52 credits/mo, 120-day rollover)</option>
          <option value="Diamond">Diamond — €499 / mo (110 credits/mo, unlimited rollover)</option>
        </select>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Create Account &rarr;</button>
    </form>

    <div class="footer-link">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>

  <div class="container" id="successContainer" style="display: none; text-align: center;">
    <h2 style="font-family: 'Baskerville', 'Garamond', serif; font-size: 26px; font-weight: normal; margin-bottom: 12px; color: #191512;">Check Your Email</h2>
    <p style="font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 20px;">We've sent a verification link to your inbox. Please click the link to activate your Zoélys portal access.</p>
    <a href="/login" style="display: inline-block; background: #191512; color: #FAF8F5; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;">Proceed to Sign In &rarr;</a>
  </div>

  <script>
    let selectedRole = 'owner';

    function setRole(role) {
      selectedRole = role;
      
      document.getElementById('btnOwner').classList.toggle('active', role === 'owner');
      document.getElementById('btnSitter').classList.toggle('active', role === 'sitter');
      document.getElementById('btnBoth').classList.toggle('active', role === 'both');

      // Sitter-only role doesn't require a pet parent membership tier selection
      const tierGroup = document.getElementById('tierGroup');
      if (tierGroup) {
        tierGroup.style.display = (role === 'sitter') ? 'none' : 'block';
      }
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorAlert = document.getElementById('errorAlert');
      const submitBtn = document.getElementById('submitBtn');
      
      errorAlert.style.display = 'none';

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        errorAlert.textContent = 'Passwords do not match. Please retype them.';
        errorAlert.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account...';

      const payload = {
        full_name: document.getElementById('fullName').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: password,
        role: selectedRole,
        tier: selectedRole === 'sitter' ? 'Standard' : document.getElementById('tier').value
      };

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Failed to create account.');
        }

        // Hide form and show success state
        document.getElementById('formContainer').style.display = 'none';
        document.getElementById('successContainer').style.display = 'block';

      } catch (err) {
        errorAlert.textContent = err.message;
        errorAlert.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account \u2192';
      }
    });
  </script>
</body>
</html>
