<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoélys — Apply for Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">

  <style>
    main.container { max-width: 480px; width: 100%; margin: 3rem auto 5rem auto; padding: 0 1.5rem; }
    .auth-card { background: white; border: 1px solid var(--border-color); border-radius: 1.2rem; padding: 2.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
    .auth-title { font-family: var(--font-serif); font-size: 2.4rem; text-align: center; font-weight: 400; margin-bottom: 0.3rem; }
    .auth-subtitle { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 2rem; }

    .role-toggle { display: grid; grid-template-columns: 1fr 1fr; background: #FAF6F0; padding: 0.3rem; border-radius: 2rem; margin-bottom: 1.5rem; border: 1px solid var(--border-color); }
    .role-btn { border: none; background: transparent; padding: 0.7rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; border-radius: 1.5rem; color: var(--text-muted); transition: all 0.2s ease; }
    .role-btn.active { background: #1C1613; color: white; }

    .form-group { margin-bottom: 1.25rem; }
    .form-label { display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--text-dark); }
    .form-input { width: 100%; padding: 0.85rem; border-radius: 0.5rem; border: 1px solid var(--border-color); font-family: var(--font-sans); background: #FAF8F5; font-size: 0.85rem; box-sizing: border-box; }
    
    .btn-coral { background: var(--accent-coral); color: white; border: none; padding: 0.95rem; border-radius: 2rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 0.08em; width: 100%; margin-top: 0.5rem; }
    .toggle-link { text-align: center; font-size: 0.8rem; color: var(--text-muted); margin-top: 1.5rem; cursor: pointer; }
    .toggle-link strong { color: var(--accent-coral); }
  </style>
</head>
<body>

  <main class="container">
    <div class="auth-card">
      <h1 class="auth-title" id="authTitle">Apply for Access</h1>
      <p class="auth-subtitle" id="authSub">Choose your role & create your concierge account.</p>

      <!-- ROLE SELECTOR -->
      <div class="role-toggle" id="roleToggleBar">
        <button type="button" class="role-btn active" onclick="setRole('owner', this)">Pet Parent 🐾</button>
        <button type="button" class="role-btn" onclick="setRole('sitter', this)">Pet Sitter 🐕</button>
      </div>

      <form onsubmit="handleAuth(event)">
        
        <!-- FULL NAME (HIDDEN ON LOGIN / FORGOT) -->
        <div class="form-group" id="nameGroup">
          <label class="form-label">Full Name</label>
          <input type="text" id="authName" placeholder="e.g. Océane Bort" class="form-input">
        </div>

        <!-- EMAIL -->
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="authEmail" placeholder="ocebort@gmail.com" required class="form-input">
        </div>

        <!-- PASSWORD -->
        <div class="form-group" id="passGroup">
          <label class="form-label">Password</label>
          <input type="password" id="authPass" placeholder="••••••••" class="form-input">
        </div>

        <!-- PET PARENT TIER SELECTION -->
        <div class="form-group" id="tierGroup">
          <label class="form-label">Select Membership Tier</label>
          <select id="authTier" class="form-input">
            <option value="Gold ($65/mo)">Gold Tier ($65/mo • 5 Credits)</option>
            <option value="Platinum ($125/mo)" selected>Platinum Tier ($125/mo • 10 Credits)</option>
            <option value="Diamond ($195/mo)">Diamond Tier ($195/mo • 15 Credits)</option>
          </select>
        </div>

        <!-- SITTER SECRET VETTING CODE FIELD -->
        <div class="form-group" id="vettingGroup" style="display: none;">
          <label class="form-label" style="color: var(--accent-coral);">🔑 Zoélys Vetting Authorization ID *</label>
          <input type="text" id="authVettingCode" placeholder="e.g. ZOELYS-VET-2026" class="form-input" style="border: 1.5px solid var(--accent-coral); background: #FFF8F6; font-weight: 600; text-transform: uppercase;">
          <span style="font-size: 0.7rem; color: var(--text-muted); display: block; margin-top: 0.3rem;">
            Required for Sitters. Provided by Zoélys Concierge after vetting.
          </span>
        </div>

        <button type="submit" class="btn-coral" id="submitBtn">REGISTER & CONTINUE &rarr;</button>
      </form>

      <div class="toggle-link" id="switchLink" onclick="toggleAuthMode()">
        Already have an account? <strong>Sign In Here</strong>
      </div>
      
      <div class="toggle-link" id="forgotLink" style="font-size: 0.75rem; margin-top: 0.8rem;" onclick="forgotPassMode()">
        Forgot password?
      </div>
    </div>
  </main>

  <script src="/navbar.js"></script>
  <script>
    let selectedRole = 'owner';
    let isRegisterMode = true;
    let isForgotMode = false;

    function setRole(role, btn) {
      selectedRole = role;
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const tierGroup = document.getElementById('tierGroup');
      const vettingGroup = document.getElementById('vettingGroup');

      if (role === 'sitter') {
        if (tierGroup) tierGroup.style.display = 'none';
        if (vettingGroup) vettingGroup.style.display = 'block';
      } else {
        if (tierGroup) tierGroup.style.display = 'block';
        if (vettingGroup) vettingGroup.style.display = 'none';
      }
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      isForgotMode = false;

      const title = document.getElementById('authTitle');
      const sub = document.getElementById('authSub');
      const nameGrp = document.getElementById('nameGroup');
      const tierGrp = document.getElementById('tierGroup');
      const vettingGrp = document.getElementById('vettingGroup');
      const passGrp = document.getElementById('passGroup');
      const roleBar = document.getElementById('roleToggleBar');
      const btn = document.getElementById('submitBtn');
      const link = document.getElementById('switchLink');

      if (isRegisterMode) {
        title.innerText = 'Apply for Access';
        sub.innerText = 'Choose your role & create your concierge account.';
        nameGrp.style.display = 'block';
        passGrp.style.display = 'block';
        roleBar.style.display = 'grid';
        btn.innerText = 'REGISTER & CONTINUE →';
        link.innerHTML = 'Already have an account? <strong>Sign In Here</strong>';
        setRole(selectedRole, document.querySelector('.role-btn.active'));
      } else {
        title.innerText = 'Member Access';
        sub.innerText = 'Sign in to your private concierge portal.';
        nameGrp.style.display = 'none';
        tierGrp.style.display = 'none';
        vettingGrp.style.display = 'none';
        roleBar.style.display = 'none';
        passGrp.style.display = 'block';
        btn.innerText = 'SIGN IN TO PORTAL →';
        link.innerHTML = 'Need an account? <strong>Register Here</strong>';
      }
    }

    function forgotPassMode() {
      isForgotMode = true;
      document.getElementById('authTitle').innerText = 'Reset Password';
      document.getElementById('authSub').innerText = 'Enter your account email to receive reset instructions.';
      document.getElementById('nameGroup').style.display = 'none';
      document.getElementById('tierGroup').style.display = 'none';
      document.getElementById('vettingGroup').style.display = 'none';
      document.getElementById('roleToggleBar').style.display = 'none';
      document.getElementById('passGroup').style.display = 'none';
      document.getElementById('submitBtn').innerText = 'SEND RESET INSTRUCTIONS →';
      document.getElementById('switchLink').innerHTML = 'Back to <strong>Sign In</strong>';
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;

      if (isForgotMode) {
        alert('✨ Password reset link sent to ' + email);
        toggleAuthMode();
        return;
      }

      const password = document.getElementById('authPass').value;

      if (isRegisterMode) {
        localStorage.clear();
        const full_name = document.getElementById('authName').value;
        const tier = document.getElementById('authTier').value;
        const vetting_code = document.getElementById('authVettingCode').value;

        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, full_name, tier, role: selectedRole, vetting_code })
        });

        const data = await res.json();
        if (data.success) {
          localStorage.setItem('zoelys_user_id', data.userId);
          window.location.href = '/dashboard';
        } else {
          alert(data.error || 'Registration failed');
        }
      } else {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (data.success) {
          localStorage.removeItem('zoelys_user_id');
          localStorage.setItem('zoelys_user_id', data.user.id);
          window.location.href = '/dashboard';
        } else {
          alert(data.error || 'Invalid credentials');
        }
      }
    }
  </script>
</body>
</html>
