<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Portal — Zoélys</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #FAF8F5;
      color: #191512;
      margin: 0;
      padding: 0;
    }
    .top-bar {
      background: #FFFFFF;
      border-bottom: 1px solid #EBE6DF;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo-area { font-family: "Baskerville", serif; font-size: 24px; letter-spacing: 0.05em; font-weight: normal; }
    .nav-container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
    
    .sub-nav {
      display: flex;
      gap: 30px;
      border-bottom: 1px solid #EBE6DF;
      background: #FFFFFF;
      padding: 0 40px;
    }
    .sub-nav a {
      padding: 15px 0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-decoration: none;
      color: #666;
      border-bottom: 2px solid transparent;
      cursor: pointer;
    }
    .sub-nav a.active {
      color: #191512;
      border-bottom-color: #191512;
      font-weight: 600;
    }

    .main-content { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    section { background: #FFFFFF; border: 1px solid #EBE6DF; border-radius: 12px; padding: 30px; margin-bottom: 30px; box-shadow: 0 4px 24px rgba(25, 21, 18, 0.02); }
    h2 { font-family: "Baskerville", serif; font-size: 24px; margin-top: 0; margin-bottom: 15px; }
    
    .action-btn {
      padding: 8px 16px; border-radius: 6px; border: none; font-size: 13px; background: #191512; color: #FAF8F5; cursor: pointer; font-weight: 600;
    }
    .action-btn:hover { background: #332B26; }
    .status-badge { background: #EBE6DF; padding: 4px 10px; border-radius: 4px; font-size: 11px; text-transform: uppercase; font-weight: bold; letter-spacing: 0.05em; }
    .status-proposed { background: #E8F4EC; color: #2E5A34; }
    .status-confirmed { background: #E6F0FA; color: #1D4ED8; }

    .request-card {
      border: 1px solid #EBE6DF; border-radius: 8px; padding: 20px; margin-bottom: 15px; background: #FAF8F5;
      display: flex; justify-content: space-between; align-items: center;
    }

    .timeline-item {
      display: flex; gap: 15px; padding: 12px 0; border-bottom: 1px solid #EBE6DF; align-items: flex-start;
    }
    .timeline-time { font-size: 12px; color: #666; width: 80px; flex-shrink: 0; font-family: monospace; }
  </style>
</head>
<body x-data="{ 
    ownerEmail: 'owner@zoelys.local',
    requests: [],
    loading: true,
    activeTab: 'overview',
    liveLogs: [
      { time: '14:30', title: 'Walk Completed', desc: 'Sunny 45-minute walk around the park. Hydrated well.', photo: 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=150&q=80' },
      { time: '11:00', title: 'Morning Feeding & Medication', desc: 'Ate full bowl of prescribed food calmly.', photo: null },
      { time: '09:15', title: 'Check-in & Settled In', desc: 'Safe arrival at sitter residence. Relaxing on the couch.', photo: null }
    ],

    async loadOwnerData() {
        this.loading = true;
        try {
            const res = await fetch(`/api/owner/requests?email=` + encodeURIComponent(this.ownerEmail));
            const data = await res.json();
            if (data.success) {
                this.requests = data.requests || [];
            }
        } catch (err) {
            console.error('Error loading owner requests:', err);
        } finally {
            this.loading = false;
        }
    },

    async acceptProposal(requestId) {
        if (!confirm('Are you sure you want to accept this proposed sitter and confirm the booking?')) return;
        try {
            const res = await fetch('/api/owner/accept-proposal', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ requestId })
            });
            const data = await res.json();
            if (data.success) {
                alert('Booking successfully confirmed!');
                await this.loadOwnerData();
            } else {
                alert('Error: ' + (data.error || 'Could not confirm booking'));
            }
        } catch (err) {
            alert('Network error while accepting proposal.');
        }
    }
}" x-init="loadOwnerData()">

  <!-- TOP BAR CENTRÉE ET HARMONIEUSE -->
  <div class="top-bar">
    <div style="display: flex; align-items: center; gap: 20px;">
      <a href="/dashboard/owner/" style="color: #191512; text-decoration: none;" class="logo-area">ZOÉLYS</a>
      <span style="font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 0.1em; border-left: 1px solid #EBE6DF; padding-left: 20px;">Owner Portal</span>
    </div>
    <div style="display: flex; align-items: center; gap: 25px; font-size: 13px;">
      <span style="color: #666;" x-text="ownerEmail"></span>
      <a href="#" style="color: #191512; text-decoration: underline;">Contact Team</a>
      <a href="/" style="color: #191512; text-decoration: none; font-weight: 600;">Sign Out</a>
    </div>
  </div>

  <!-- SOUS-NAVIGATION -->
  <div class="sub-nav">
    <a :class="activeTab === 'overview' ? 'active' : ''" @click="activeTab = 'overview'">Overview & Requests</a>
    <a :class="activeTab === 'pets' ? 'active' : ''" @click="activeTab = 'pets'">Pet Profiles & Medical</a>
    <a :class="activeTab === 'safety' ? 'active' : ''" @click="activeTab = 'safety'">Safety & Protocols</a>
    <a :class="activeTab === 'billing' ? 'active' : ''" @click="activeTab = 'billing'">Credits & Subscriptions</a>
  </div>

  <div class="main-content">

    <!-- TAB OVERVIEW -->
    <template x-if="activeTab === 'overview'">
      <div>
        
        <!-- LIVE TIMELINE LOGS & PHOTOS -->
        <section>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
              <span class="status-badge" style="background: #E8F4EC; color: #2E5A34;">Live Stay Active</span>
              <h2 style="margin: 6px 0 0 0;">Care Log & Live Updates</h2>
            </div>
            <button @click="alert('Instant update requested from sitter.')" class="action-btn" style="background: #FAF8F5; color: #191512; border: 1px solid #EBE6DF;">Request Instant Update ⚡</button>
          </div>

          <p style="color: #666; font-size: 13px; margin-bottom: 20px;">Real-time timeline logs, walk tracking, and photos securely uploaded by your verified sitter.</p>

          <div style="display: flex; flex-direction: column; gap: 5px;">
            <template x-for="log in liveLogs">
              <div class="timeline-item">
                <div class="timeline-time" x-text="log.time"></div>
                <div style="flex: 1;">
                  <h4 style="margin: 0 0 4px 0; font-size: 14px;" x-text="log.title"></h4>
                  <p style="margin: 0; font-size: 13px; color: #555;" x-text="log.desc"></p>
                  <template x-if="log.photo">
                    <div style="margin-top: 10px;">
                      <img :src="log.photo" style="width: 120px; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid #EBE6DF;">
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </section>

        <!-- PENDING & PROPOSED REQUESTS (AVEC BOUTON D'ACCEPTATION POUR LE PROPRIÉTAIRE) -->
        <section>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">Your Booking Requests & Sitter Proposals</h2>
            <button @click="loadOwnerData()" class="action-btn" style="background: #FAF8F5; color: #191512; border: 1px solid #EBE6DF; font-size: 11px; text-transform: uppercase;">Refresh Requests</button>
          </div>

          <template x-if="loading">
            <div style="text-align: center; color: #666; padding: 20px;">Loading your requests...</div>
          </template>

          <template x-if="!loading && requests.length === 0">
            <p style="color: #666; font-style: italic;">No active booking requests found. Use the concierge intake to book a stay.</p>
          </template>

          <template x-if="!loading && requests.length > 0">
            <div style="display: flex; flex-direction: column; gap: 15px;">
              <template x-for="req in requests" :key="req.id">
                <div class="request-card">
                  <div>
                    <span style="font-family: monospace; font-size: 11px; color: #666;" x-text="'#' + req.id"></span>
                    <h3 style="margin: 4px 0; font-size: 16px;" x-text="'Pet: ' + (req.pet_name || 'Companion') + ' (' + (req.pet_type || 'Pet') + ')'"></h3>
                    <p style="margin: 0; font-size: 13px; color: #666;" x-text="'Service: ' + (req.service_type || 'Standard Care')"></p>
                  </div>

                  <div style="display: flex; align-items: center; gap: 15px;">
                    <!-- Badge de statut -->
                    <span class="status-badge" :class="{
                      'status-proposed': req.status === 'proposed',
                      'status-confirmed': req.status === 'confirmed'
                    }" x-text="req.status || 'pending'"></span>

                    <!-- BOUTON D'ACCEPTATION SI PROPOSÉ -->
                    <template x-if="req.status === 'proposed'">
                      <button @click="acceptProposal(req.id)" class="action-btn" style="background: #2E5A34;">
                        Accept Sitter & Confirm →
                      </button>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </section>

      </div>
    </template>

    <!-- AUTRES ONGLETS (PLACEHOLDERS PROPRES) -->
    <template x-if="activeTab === 'pets'">
      <section>
        <h2>Pet Profiles & Medical Records</h2>
        <p style="color: #666; font-size: 14px;">Manage your companion's dietary requirements, vaccination history, and medical vault.</p>
      </section>
    </template>

    <template x-if="activeTab === 'safety'">
      <section>
        <h2>Safety Protocols & Emergency Contacts</h2>
        <p style="color: #666; font-size: 14px;">Review emergency vet instructions and security guidelines.</p>
      </section>
    </template>

    <template x-if="activeTab === 'billing'">
      <section>
        <h2>Credits & Subscriptions</h2>
        <p style="color: #666; font-size: 14px;">Manage your Zoélys high-trust platform credits and membership status.</p>
      </section>
    </template>

  </div>

</body>
</html>
