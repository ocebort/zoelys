<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Zoélys</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #FAF8F5;
      color: #191512;
      margin: 0;
      padding: 40px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      border-bottom: 1px solid #EBE6DF;
      padding-bottom: 20px;
    }
    h1 { font-family: "Baskerville", serif; font-size: 32px; margin: 0; font-weight: normal; }
    .badge {
      background: #191512; color: #FAF8F5; padding: 6px 12px;
      border-radius: 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: #FFFFFF; border: 1px solid #EBE6DF; border-radius: 12px; padding: 24px; box-shadow: 0 4px 24px rgba(25, 21, 18, 0.02); }
    .stat-card h3 { font-size: 11px; text-transform: uppercase; color: #666; margin: 0 0 8px 0; }
    .stat-card .number { font-size: 32px; font-weight: 600; margin: 0; }
    section { background: #FFFFFF; border: 1px solid #EBE6DF; border-radius: 12px; padding: 30px; margin-bottom: 30px; }
    h2 { font-family: "Baskerville", serif; font-size: 22px; margin-top: 0; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 12px 16px; border-bottom: 1px solid #EBE6DF; text-align: left; }
    th { font-size: 11px; text-transform: uppercase; color: #666; background: #FAF8F5; }
    select, button.action-btn {
      padding: 6px 12px; border-radius: 6px; border: 1px solid #EBE6DF; font-size: 13px; background: #FAF8F5; cursor: pointer;
    }
    button.action-btn { background: #191512; color: #FAF8F5; border: none; font-weight: 600; }
    .status-badge { background: #EBE6DF; padding: 4px 8px; border-radius: 4px; font-size: 12px; text-transform: uppercase; }
    .loading { text-align: center; color: #666; padding: 20px; }
    
    .modal-backdrop { position: fixed; inset: 0; background: rgba(25, 21, 18, 0.4); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .modal-card { background: #FAF8F5; border: 1px solid #EBE6DF; border-radius: 12px; padding: 30px; max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 28px 52px rgba(25,21,18,0.22); }
  </style>
</head>
<body x-data="{ 
    stats: { totalUsers: 0, totalOwners: 0, totalSitters: 0, totalRequests: 0 },
    requests: [],
    sitters: [],
    loadingData: true,
    loadError: null,
    showMatchModal: false,
    selectedRequest: null,
    topMatches: [],
    allSitters: [],
    selectedSitterIds: [],
    isCalculating: false,
    showBackupCatalog: false,
    sitterSearchQuery: '',

    async loadAdminData() {
        this.loadingData = true;
        this.loadError = null;
        try {
            const res = await fetch('/api/admin/overview', { cache: 'no-store' });
            const text = await res.text();
            
            if (!text || text.trim().startsWith('<') || !text.trim().startsWith('{')) {
                this.loadError = 'Cloudflare Function Routing Notice: API endpoint is treated as static page.';
                this.loadingData = false;
                return;
            }

            const data = JSON.parse(text);
            this.stats = data.stats || this.stats;
            this.requests = data.requests || [];
            this.sitters = data.sitters || [];
        } catch (err) {
            console.error(err);
            this.loadError = 'Error loading data: ' + err.message;
        } finally {
            this.loadingData = false;
        }
    },

    async runMatchingAlgorithm(req) {
        this.selectedRequest = req;
        this.isCalculating = true;
        this.showMatchModal = true;
        this.topMatches = [];
        this.allSitters = [];
        this.selectedSitterIds = [];
        this.showBackupCatalog = false;
        this.sitterSearchQuery = '';

        try {
            const res = await fetch(`/api/admin/match?requestId=` + encodeURIComponent(req.id));
            const data = await res.json();
            if (data.success) {
                this.topMatches = data.topMatches || [];
                this.allSitters = data.topMatches || [];
                // Sélectionne par défaut le Top 3 algorithmique
                this.selectedSitterIds = this.topMatches.slice(0, 3).map(s => s.email || s.id);
            } else {
                alert('Error running algorithm: ' + (data.error || 'Unknown'));
            }
        } catch (err) {
            console.error('Matching error:', err);
            alert('Network error while running algorithm.');
        } finally {
            this.isCalculating = false;
        }
    },

    toggleSitterSelection(id) {
        if (this.selectedSitterIds.includes(id)) {
            this.selectedSitterIds = this.selectedSitterIds.filter(item => item !== id);
        } else {
            this.selectedSitterIds.push(id);
        }
    },

    filteredBackupSitters() {
        if (!this.sitterSearchQuery.trim()) return this.allSitters;
        const q = this.sitterSearchQuery.toLowerCase();
        return this.allSitters.filter(s => 
            (s.full_name && s.full_name.toLowerCase().includes(q)) ||
            (s.email && s.email.toLowerCase().includes(q)) ||
            (s.location && s.location.toLowerCase().includes(q)) ||
            (s.role && s.role.toLowerCase().includes(q))
        );
    },

    async sendProposalToOwner() {
        if (!this.selectedRequest) return;
        if (this.selectedSitterIds.length === 0) {
            alert('Please select at least one caregiver to propose.');
            return;
        }

        try {
            const res = await fetch('/api/admin/propose', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    requestId: this.selectedRequest.id,
                    selectedSitterIds: this.selectedSitterIds
                })
            });
            const data = await res.json();
            if (data.success) {
                alert('Proposal successfully sent to pet owner!');
                this.showMatchModal = false;
                await this.loadAdminData();
            } else {
                alert('Error: ' + (data.error || 'Could not send proposal'));
            }
        } catch (err) {
            alert('Network error while sending proposal.');
        }
    },

    async cancelProposal(req) {
        if (!confirm(`Are you sure you want to cancel the proposal for request #${req.id}? This will reset it to pending.`)) return;
        try {
            const res = await fetch('/api/admin/cancel-proposal', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ requestId: req.id })
            });
            const data = await res.json();
            if (data.success) {
                alert('Proposal canceled successfully.');
                await this.loadAdminData();
            } else {
                alert('Error: ' + (data.error || 'Could not cancel proposal'));
            }
        } catch (err) {
            alert('Network error while canceling proposal.');
        }
    }
}" x-init="loadAdminData()">

  <div class="container">
    <header>
      <div>
        <h1>Zoélys Command Center</h1>
        <p style="color: #666; margin: 4px 0 0 0; font-size: 14px;">Platform oversight, matching engine, and user operations.</p>
      </div>
      <div style="display: flex; gap: 15px; align-items: center;">
        <a href="/dashboard/sitters/" target="_blank" style="font-size: 13px; color: #191512; text-decoration: underline; font-weight: 500;">View Sitter Dashboard ↗</a>
        <div class="badge">Admin Portal</div>
      </div>
    </header>

    <template x-if="loadError">
      <div style="padding: 15px; background: #FFF8F6; border: 1px solid #F0C4B8; border-radius: 6px; color: #B33A3A; margin-bottom: 25px;" x-text="loadError"></div>
    </template>

    <div class="stats-grid">
      <div class="stat-card"><h3>Total Users</h3><p class="number" x-text="stats.totalUsers">0</p></div>
      <div class="stat-card"><h3>Pet Owners</h3><p class="number" x-text="stats.totalOwners">0</p></div>
      <div class="stat-card"><h3>Verified Sitters</h3><p class="number" x-text="stats.totalSitters">0</p></div>
      <div class="stat-card"><h3>Care Requests</h3><p class="number" x-text="stats.totalRequests">0</p></div>
    </div>

    <!-- CARE REQUESTS SECTION -->
    <section>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0;">Care Requests & Algorithm Matching</h2>
        <button @click="loadAdminData()" class="action-btn" style="font-size: 11px; text-transform: uppercase;">Refresh Requests</button>
      </div>

      <template x-if="loadingData">
        <div class="loading">Loading requests...</div>
      </template>

      <template x-if="!loadingData && requests.length === 0">
        <p style="color: #666; font-style: italic;">No care requests found in database.</p>
      </template>

      <template x-if="!loadingData && requests.length > 0">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Client</th>
              <th>Pet</th>
              <th>Service</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="req in requests" :key="req.id">
              <tr>
                <td style="font-family: monospace; font-size: 12px;" x-text="'#' + req.id"></td>
                <td>
                  <strong x-text="req.full_name || 'Client'"></strong><br>
                  <span style="color: #666; font-size: 12px;" x-text="req.email || ''"></span>
                </td>
                <td x-text="(req.pet_name || 'Pet') + ' (' + (req.pet_type || 'N/A') + ')'"></td>
                <td x-text="req.service_type || 'Care'"></td>
                <td><span class="status-badge" x-text="req.status || 'pending'"></span></td>
                <td>
                  <button x-show="req.status === 'pending'" @click="runMatchingAlgorithm(req)" class="action-btn" style="font-size: 11px;">
                    Review & Match ⚡
                  </button>
                  <button x-show="req.status === 'proposed'" @click="cancelProposal(req)" class="action-btn" style="font-size: 11px; background: #B33A3A;">
                    Cancel Proposal ✕
                  </button>
                  <span x-show="req.status !== 'pending' && req.status !== 'proposed'" style="font-size: 12px; color: #666; font-style: italic;" x-text="req.status"></span>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </template>
    </section>

    <!-- ACTIVE CAREGIVER ROSTER SECTION -->
    <section>
      <h2>Active Caregiver Roster</h2>
      <template x-if="loadingData">
        <div class="loading">Loading sitters...</div>
      </template>
      <template x-if="!loadingData && sitters.length === 0">
        <p style="color: #666; font-style: italic;">No sitters registered.</p>
      </template>
      <template x-if="!loadingData && sitters.length > 0">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Location</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="s in sitters" :key="s.email">
              <tr>
                <td><strong x-text="s.full_name || 'N/A'"></strong></td>
                <td x-text="s.email"></td>
                <td x-text="s.role"></td>
                <td x-text="s.location || 'Lisbon'"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </template>
    </section>
  </div>

  <!-- ALGORITHM & BACKUP MODAL -->
  <div x-show="showMatchModal" class="modal-backdrop" style="display: none;">
    <div @click.away="showMatchModal = false" class="modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #EBE6DF; padding-bottom: 15px; margin-bottom: 20px;">
        <div>
          <span style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #666;">Concierge Control Center</span>
          <h3 style="font-family: 'Baskerville', serif; font-size: 20px; margin: 4px 0 0 0;" x-text="'Algorithm Recommendations for ' + (selectedRequest ? selectedRequest.pet_name : '')"></h3>
        </div>
        <button @click="showMatchModal = false" style="background: none; border: none; font-size: 14px; cursor: pointer; color: #666;">Close ✕</button>
      </div>

      <template x-if="isCalculating">
        <div class="loading" style="padding: 40px 0;">Running recommendation algorithm...</div>
      </template>

      <template x-if="!isCalculating">
        <div style="display: flex; flex-direction: column; gap: 16px;">
          
          <!-- 1. TOP MATCHES DE L'ALGORITHME -->
          <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
              <h4 style="margin: 0; font-size: 14px; text-transform: uppercase; color: #666; letter-spacing: 0.05em;">Top Algorithm Recommendations</h4>
              <button @click="runMatchingAlgorithm(selectedRequest)" class="action-btn" style="background: #FAF8F5; color: #191512; border: 1px solid #EBE6DF; font-size: 11px;">Re-run Algorithm ⟳</button>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px;">
              <template x-for="(sitter, index) in topMatches.slice(0, 3)" :key="sitter.email">
                <div style="border: 1px solid #EBE6DF; background: #FFFFFF; border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;">
                  <div style="display: flex; align-items: center; gap: 12px;">
                    <input type="checkbox" :checked="selectedSitterIds.includes(sitter.email || sitter.id)" @change="toggleSitterSelection(sitter.email || sitter.id)" style="width: 16px; height: 16px; cursor: pointer;">
                    <div>
                      <span style="font-size: 10px; font-weight: bold; background: #FAF8F5; border: 1px solid #EBE6DF; padding: 2px 5px; border-radius: 3px;" x-text="'Rank #' + (index + 1)"></span>
                      <h4 style="margin: 4px 0 0 0; font-size: 14px; font-weight: 600;" x-text="sitter.full_name || sitter.email"></h4>
                      <p style="margin: 2px 0 0 0; font-size: 11px; color: #666;" x-text="(sitter.location || 'Lisbon') + ' • ' + (sitter.role || 'pet_sitter')"></p>
                    </div>
                  </div>
                  <span style="font-size: 14px; font-family: 'Baskerville', serif; color: #2E5A34; font-weight: bold;" x-text="(sitter.matchScore || 85) + '% Match'"></span>
                </div>
              </template>

              <template x-if="topMatches.length === 0">
                <p style="text-align: center; color: #666; font-style: italic; padding: 15px 0;">No automatic matches found by algorithm.</p>
              </template>
            </div>
          </div>

          <!-- 2. BOUTON DE SECOURS (BACKUP CATALOG) -->
          <div style="border-top: 1px dashed #EBE6DF; padding-top: 15px;">
            <button @click="showBackupCatalog = !showBackupCatalog" class="action-btn" style="background: #FAF8F5; color: #191512; border: 1px solid #EBE6DF; width: 100%; text-align: center; padding: 10px; font-size: 12px;">
              <span x-text="showBackupCatalog ? '▲ Hide Backup Sitter Catalog' : '▼ Backup Plan: Browse & Add Any Sitter from Platform'"></span>
            </button>

            <!-- Catalogue de secours filtrable -->
            <div x-show="showBackupCatalog" style="margin-top: 12px; background: #FFF; border: 1px solid #EBE6DF; border-radius: 8px; padding: 16px;">
              <input type="text" x-model="sitterSearchQuery" placeholder="Search by name (e.g. Test Sitter) or city..." style="width: 100%; padding: 8px 12px; border: 1px solid #EBE6DF; border-radius: 6px; font-size: 13px; background: #FAF8F5; outline: none; margin-bottom: 12px; box-sizing: border-box;">

              <div style="display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto;">
                <template x-for="sitter in filteredBackupSitters()" :key="sitter.email">
                  <div @click="toggleSitterSelection(sitter.email || sitter.id)" 
                       style="border: 1px solid #EBE6DF; background: #FAF8F5; border-radius: 6px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;"
                       :style="selectedSitterIds.includes(sitter.email || sitter.id) ? 'border-color: #191512; background: #FDFBF7;' : ''">
                    <div style="display: flex; align-items: center; gap: 10px;">
                      <input type="checkbox" :checked="selectedSitterIds.includes(sitter.email || sitter.id)" @click.stop="toggleSitterSelection(sitter.email || sitter.id)" style="width: 15px; height: 15px; cursor: pointer;">
                      <div>
                        <strong style="font-size: 13px;" x-text="sitter.full_name || sitter.email"></strong>
                        <span style="font-size: 11px; color: #666; display: block;" x-text="(sitter.location || 'Lisbon') + ' • ' + sitter.role"></span>
                      </div>
                    </div>
                    <span style="font-size: 11px; color: #666; font-style: italic;">Manual Add</span>
                  </div>
                </template>
              </div>
            </div>
          </div>

          <!-- Actions de fin de modale -->
          <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 10px; border-top: 1px solid #EBE6DF; padding-top: 15px;">
            <button @click="showMatchModal = false" class="action-btn" style="background: #FAF8F5; color: #191512; border: 1px solid #EBE6DF;">Cancel</button>
            <button @click="sendProposalToOwner()" class="action-btn" :disabled="selectedSitterIds.length === 0">Send Selected Proposal to Owner →</button>
          </div>
        </div>
      </template>
    </div>
  </div>

</body>
</html>
