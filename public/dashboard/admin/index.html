<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Zoélys</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #FAF8F5;
      color: #191512;
      margin: 0;
      padding: 40px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      border-bottom: 1px solid #EBE6DF;
      padding-bottom: 20px;
    }
    h1 { font-family: "Baskerville", serif; font-size: 32px; margin: 0; font-weight: normal; }
    .badge {
      background: #191512; color: #FAF8F5; padding: 6px 12px;
      border-radius: 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: #FFFFFF; border: 1px solid #EBE6DF; border-radius: 12px; padding: 24px; box-shadow: 0 4px 24px rgba(25, 21, 18, 0.02); }
    .stat-card h3 { font-size: 11px; text-transform: uppercase; color: #666; margin: 0 0 8px 0; }
    .stat-card .number { font-size: 32px; font-weight: 600; margin: 0; }
    section { background: #FFFFFF; border: 1px solid #EBE6DF; border-radius: 12px; padding: 30px; margin-bottom: 30px; }
    h2 { font-family: "Baskerville", serif; font-size: 22px; margin-top: 0; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 12px 16px; border-bottom: 1px solid #EBE6DF; text-align: left; }
    th { font-size: 11px; text-transform: uppercase; color: #666; background: #FAF8F5; }
    select, button.action-btn {
      padding: 6px 12px; border-radius: 6px; border: 1px solid #EBE6DF; font-size: 13px; background: #FAF8F5; cursor: pointer;
    }
    button.action-btn { background: #191512; color: #FAF8F5; border: none; font-weight: 600; }
    .loading { text-align: center; color: #666; padding: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Zoélys Command Center</h1>
        <p style="color: #666; margin: 4px 0 0 0; font-size: 14px;">Platform oversight, matching engine, and user operations.</p>
      </div>
      <div class="badge">Admin Portal</div>
    </header>

    <div class="stats-grid">
      <div class="stat-card"><h3>Total Users</h3><p class="number" id="statUsers">0</p></div>
      <div class="stat-card"><h3>Pet Owners</h3><p class="number" id="statOwners">0</p></div>
      <div class="stat-card"><h3>Verified Sitters</h3><p class="number" id="statSitters">0</p></div>
      <div class="stat-card"><h3>Care Requests</h3><p class="number" id="statRequests">0</p></div>
    </div>

    <section>
      <h2>Care Requests & Algorithm Matching</h2>
      <div id="requestsContainer" class="loading">Loading requests...</div>
    </section>

    <section>
      <h2>Active Caregiver Roster</h2>
      <div id="sittersContainer" class="loading">Loading sitters...</div>
    </section>
  </div>

  <script>
    async function loadDashboard() {
      const reqContainer = document.getElementById('requestsContainer');
      const sitterContainer = document.getElementById('sittersContainer');

      try {
        const res = await fetch('/api/admin/overview', { cache: 'no-store' });
        const text = await res.text();
        
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error("Invalid JSON response from server: " + text.substring(0, 100));
        }

        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Failed to load overview data');
        }

        // Update Stats
        document.getElementById('statUsers').textContent = data.stats.totalUsers;
        document.getElementById('statOwners').textContent = data.stats.totalOwners;
        document.getElementById('statSitters').textContent = data.stats.totalSitters;
        document.getElementById('statRequests').textContent = data.stats.totalRequests;

        // Render Requests Table
        if (!data.requests || data.requests.length === 0) {
          reqContainer.innerHTML = '<p style="color: #666; font-style: italic;">No care requests found.</p>';
        } else {
          let html = `<table><thead><tr><th>ID</th><th>Client</th><th>Pet</th><th>Service</th><th>Status</th><th>Action</th></tr></thead><tbody>`;
          data.requests.forEach(r => {
            let sitterOptions = `<option value="">Select sitter...</option>`;
            (data.sitters || []).forEach(s => {
              sitterOptions += `<option value="${s.id}">${s.full_name || s.email}</option>`;
            });

            html += `<tr>
              <td>#${r.id}</td>
              <td><strong>${r.full_name}</strong><br><span style="color: #666; font-size: 12px;">${r.email}</span></td>
              <td>${r.pet_name || 'Pet'} (${r.pet_type || 'N/A'})</td>
              <td>${r.service_type || 'Care'}</td>
              <td><span style="background: #EBE6DF; padding: 4px 8px; border-radius: 4px; font-size: 12px;">${r.status || 'pending'}</span></td>
              <td>
                <div style="display: flex; gap: 6px;">
                  <select id="sitter-select-${r.id}">${sitterOptions}</select>
                  <button class="action-btn" onclick="alert('Assigned request #${r.id}')">Assign</button>
                </div>
              </td>
            </tr>`;
          });
          html += `</tbody></table>`;
          reqContainer.innerHTML = html;
        }

        // Render Sitters Table
        if (!data.sitters || data.sitters.length === 0) {
          sitterContainer.innerHTML = '<p style="color: #666; font-style: italic;">No sitters registered.</p>';
        } else {
          let sHtml = `<table><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>`;
          data.sitters.forEach(s => {
            sHtml += `<tr><td><strong>${s.full_name || 'N/A'}</strong></td><td>${s.email}</td><td>${s.role}</td></tr>`;
          });
          sHtml += `</tbody></table>`;
          sitterContainer.innerHTML = sHtml;
        }

      } catch (err) {
        console.error(err);
        reqContainer.innerHTML = `<p style="color: #B33A3A;">Error: ${err.message}</p>`;
        sitterContainer.innerHTML = `<p style="color: #666;">Unable to load roster.</p>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadDashboard);
  </script>
</body>
</html>
