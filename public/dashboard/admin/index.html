<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Zoélys</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #FAF8F5;
      color: #191512;
      margin: 0;
      padding: 40px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      border-bottom: 1px solid #EBE6DF;
      padding-bottom: 20px;
    }
    h1 { font-family: "Baskerville", serif; font-size: 32px; margin: 0; font-weight: normal; }
    .badge {
      background: #191512; color: #FAF8F5; padding: 6px 12px;
      border-radius: 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: #FFFFFF; border: 1px solid #EBE6DF; border-radius: 12px; padding: 24px; }
    .stat-card h3 { font-size: 11px; text-transform: uppercase; color: #666; margin: 0 0 8px 0; }
    .stat-card .number { font-size: 32px; font-weight: 600; margin: 0; }
    section { background: #FFFFFF; border: 1px solid #EBE6DF; border-radius: 12px; padding: 30px; margin-bottom: 30px; }
    h2 { font-family: "Baskerville", serif; font-size: 22px; margin-top: 0; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 12px 16px; border-bottom: 1px solid #EBE6DF; text-align: left; }
    th { font-size: 11px; text-transform: uppercase; color: #666; background: #FAF8F5; }
    .loading { text-align: center; color: #666; padding: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Zoélys Command Center</h1>
        <p style="color: #666; margin: 4px 0 0 0; font-size: 14px;">Platform oversight, matching engine, and user operations.</p>
      </div>
      <div class="badge">Admin Portal</div>
    </header>

    <div class="stats-grid">
      <div class="stat-card"><h3>Total Users</h3><p class="number" id="statUsers">0</p></div>
      <div class="stat-card"><h3>Pet Owners</h3><p class="number" id="statOwners">0</p></div>
      <div class="stat-card"><h3>Verified Sitters</h3><p class="number" id="statSitters">0</p></div>
      <div class="stat-card"><h3>Care Requests</h3><p class="number" id="statRequests">0</p></div>
    </div>

    <section>
      <h2>Care Requests & Algorithm Matching</h2>
      <div id="requestsContainer" class="loading">Loading requests...</div>
    </section>

    <section>
      <h2>Active Caregiver Roster</h2>
      <div id="sittersContainer" class="loading">Loading sitters...</div>
    </section>
  </div>

  <script>
    async function loadDashboard() {
      const reqContainer = document.getElementById('requestsContainer');
      const sitterContainer = document.getElementById('sittersContainer');

      try {
        // Fetch from overview endpoint with fallback to direct requests endpoint
        let res = await fetch('/api/admin/overview', { cache: 'no-store' });
        let data;

        if (res.ok) {
          const text = await res.text();
          if (text && text.trim().startsWith('{')) {
            data = JSON.parse(text);
          }
        }

        // Fallback: If overview API is blocked by Cloudflare static router, try /api/requests
        if (!data || !data.success) {
          console.warn('Overview route unavailable, attempting secondary endpoint...');
          const fallbackRes = await fetch('/api/requests', { cache: 'no-store' });
          if (fallbackRes.ok) {
            const rawReqs = await fallbackRes.json();
            const list = Array.isArray(rawReqs) ? rawReqs : (rawReqs.requests || []);
            data = {
              success: true,
              stats: { totalUsers: 0, totalOwners: 0, totalSitters: 0, totalRequests: list.length },
              requests: list,
              sitters: []
            };
          }
        }

        if (!data || !data.success) {
          reqContainer.innerHTML = '<p style="color: #666;">No care requests currently active in database.</p>';
          sitterContainer.innerHTML = '<p style="color: #666;">No verified sitters registered.</p>';
          return;
        }

        // Display Stats
        document.getElementById('statUsers').textContent = data.stats.totalUsers || 0;
        document.getElementById('statOwners').textContent = data.stats.totalOwners || 0;
        document.getElementById('statSitters').textContent = data.stats.totalSitters || 0;
        document.getElementById('statRequests').textContent = data.stats.totalRequests || (data.requests ? data.requests.length : 0);

        // Render Requests
        if (!data.requests || data.requests.length === 0) {
          reqContainer.innerHTML = '<p style="color: #666;">No care requests found.</p>';
        } else {
          let html = `<table><thead><tr><th>ID</th><th>Client</th><th>Details</th><th>Status</th></tr></thead><tbody>`;
          data.requests.forEach(r => {
            html += `<tr>
              <td>#${r.id || 'N/A'}</td>
              <td>${r.full_name || r.email || 'Client'}</td>
              <td>${r.pet_name || r.details || r.service_type || 'Care Booking'}</td>
              <td><span style="background: #EBE6DF; padding: 4px 8px; border-radius: 4px; font-size: 12px;">${r.status || 'Pending'}</span></td>
            </tr>`;
          });
          html += `</tbody></table>`;
          reqContainer.innerHTML = html;
        }

        // Render Sitters
        if (!data.sitters || data.sitters.length === 0) {
          sitterContainer.innerHTML = '<p style="color: #666;">No sitters found.</p>';
        } else {
          let sHtml = `<table><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>`;
          data.sitters.forEach(s => {
            sHtml += `<tr><td><strong>${s.full_name || 'N/A'}</strong></td><td>${s.email}</td><td>${s.role}</td></tr>`;
          });
          sHtml += `</tbody></table>`;
          sitterContainer.innerHTML = sHtml;
        }

      } catch (err) {
        console.error(err);
        reqContainer.innerHTML = `<p style="color: #666;">Dashboard loaded in offline mode.</p>`;
        sitterContainer.innerHTML = `<p style="color: #666;">No active sitters listed.</p>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadDashboard);
  </script>
</body>
</html>
