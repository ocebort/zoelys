<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Zoélys</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FAF8F5;
      color: #191512;
      margin: 0;
      padding: 40px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      border-bottom: 1px solid #EBE6DF;
      padding-bottom: 20px;
    }
    h1 {
      font-family: "Baskerville", "Garamond", serif;
      font-size: 32px;
      margin: 0;
      font-weight: normal;
    }
    .badge {
      background: #191512;
      color: #FAF8F5;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: #FFFFFF;
      border: 1px solid #EBE6DF;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 24px rgba(25, 21, 18, 0.02);
    }
    .stat-card h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #666;
      margin: 0 0 8px 0;
    }
    .stat-card .number {
      font-size: 32px;
      font-weight: 600;
      color: #191512;
      margin: 0;
    }
    section {
      background: #FFFFFF;
      border: 1px solid #EBE6DF;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 4px 24px rgba(25, 21, 18, 0.02);
    }
    h2 {
      font-family: "Baskerville", "Garamond", serif;
      font-size: 22px;
      margin-top: 0;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }
    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid #EBE6DF;
    }
    th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #666;
      background: #FAF8F5;
    }
    select, button.action-btn {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #EBE6DF;
      font-size: 13px;
      background: #FAF8F5;
      cursor: pointer;
    }
    button.action-btn {
      background: #191512;
      color: #FAF8F5;
      border: none;
      font-weight: 600;
    }
    button.action-btn:hover {
      opacity: 0.9;
    }
    .loading {
      text-align: center;
      color: #666;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Zoélys Command Center</h1>
        <p style="color: #666; margin: 4px 0 0 0; font-size: 14px;">Platform oversight, matching engine, and user operations.</p>
      </div>
      <div class="badge">Admin Portal</div>
    </header>

    <!-- Metrics Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Users</h3>
        <p class="number" id="statUsers">-</p>
      </div>
      <div class="stat-card">
        <h3>Pet Owners</h3>
        <p class="number" id="statOwners">-</p>
      </div>
      <div class="stat-card">
        <h3>Verified Sitters</h3>
        <p class="number" id="statSitters">-</p>
      </div>
      <div class="stat-card">
        <h3>Care Requests</h3>
        <p class="number" id="statRequests">-</p>
      </div>
    </div>

    <!-- Requests & Matching Section -->
    <section>
      <h2>Care Requests & Algorithm Matching</h2>
      <div id="requestsContainer" class="loading">Loading platform activity...</div>
    </section>

    <!-- Sitters Directory Section -->
    <section>
      <h2>Active Caregiver Roster</h2>
      <div id="sittersContainer" class="loading">Loading sitter roster...</div>
    </section>
  </div>

  <script>
    async function loadAdminData() {
      try {
        const res = await fetch('/api/admin/overview');
        const data = await res.json();

        if (!data.success) {
          throw new Error(data.error || 'Failed to load admin metrics.');
        }

        // Update stats
        document.getElementById('statUsers').textContent = data.stats.totalUsers;
        document.getElementById('statOwners').textContent = data.stats.totalOwners;
        document.getElementById('statSitters').textContent = data.stats.totalSitters;
        document.getElementById('statRequests').textContent = data.stats.totalRequests;

        // Render Requests Table
        const reqContainer = document.getElementById('requestsContainer');
        if (!data.requests || data.requests.length === 0) {
          reqContainer.innerHTML = '<p style="color: #666; font-style: italic;">No care requests submitted yet.</p>';
        } else {
          let html = `
            <table>
              <thead>
                <tr>
                  <th>Request ID</th>
                  <th>Details</th>
                  <th>Status</th>
                  <th>Assign Sitter (Algorithm Match)</th>
                </tr>
              </thead>
              <tbody>
          `;
          data.requests.forEach(req => {
            let sitterOptions = `<option value="">Select recommended sitter...</option>`;
            data.sitters.forEach(sitter => {
              sitterOptions += `<option value="${sitter.id}">${sitter.full_name} (${sitter.email})</option>`;
            });

            html += `
              <tr>
                <td>#${req.id || 'N/A'}</td>
                <td>${req.details || req.pet_info || 'Standard Care Booking'}</td>
                <td><span style="background: #EBE6DF; padding: 4px 8px; border-radius: 4px; font-size: 12px;">${req.status || 'Pending'}</span></td>
                <td>
                  <div style="display: flex; gap: 8px;">
                    <select id="sitter-select-${req.id}">${sitterOptions}</select>
                    <button class="action-btn" onclick="alert('Assignment feature connected to database pipeline!')">Assign</button>
                  </div>
                </td>
              </tr>
            `;
          });
          html += `</tbody></table>`;
          reqContainer.innerHTML = html;
        }

        // Render Sitters Table
        const sitterContainer = document.getElementById('sittersContainer');
        if (!data.sitters || data.sitters.length === 0) {
          sitterContainer.innerHTML = '<p style="color: #666; font-style: italic;">No verified sitters found in database.</p>';
        } else {
          let sHtml = `
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
          `;
          data.sitters.forEach(s => {
            sHtml += `
              <tr>
                <td><strong>${s.full_name}</strong></td>
                <td>${s.email}</td>
                <td>${s.role}</td>
                <td><span style="color: #2e7d32; font-weight: 600;">Active & Verified</span></td>
              </tr>
            `;
          });
          sHtml += `</tbody></table>`;
          sitterContainer.innerHTML = sHtml;
        }

      } catch (err) {
        console.error(err);
        document.getElementById('requestsContainer').innerHTML = `<p style="color: #B33A3A;">Error loading dashboard data: ${err.message}</p>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadAdminData);
  </script>
</body>
</html>
